name: One Browser App
run-name: ${{ github.workflow }}

# Runs on deploy/browser-app/<version> tags pushed by `make deploy-browser-app`.
'on':
  push:
    tags: ["deploy/browser-app/*"]

permissions:
  contents: read

concurrency:
  group: one-browser-app-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-publish-tauri-app.yml
    with:
      app: browser
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
