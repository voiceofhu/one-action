name: One Browser Runtime

'on':
  workflow_dispatch:
    inputs:
      expected_action_sha:
        description: Dispatcher-resolved exact central Action commit SHA
        required: true
        type: string
      runtime_repository:
        description: Browser Runtime source repository
        required: true
        type: string
      runtime_ref:
        description: Exact Runtime SHA; prepare remains blocked until its repository trust root is approved
        required: true
        type: string
      version:
        description: Optional requested version
        required: false
        type: string
      publish:
        description: Reserved until multi-platform Runtime packaging is implemented
        required: false
        type: boolean
        default: false
      confirmation:
        description: Required only for a future mutation request
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/reusable-prepare.yml
    with:
      workflow_name: browser-runtime
      expected_action_sha: ${{ inputs.expected_action_sha }}
      primary_label: runtime
      primary_repository: ${{ inputs.runtime_repository }}
      primary_ref: ${{ inputs.runtime_ref }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      publish_supported: false
      confirmation: ${{ inputs.confirmation }}
