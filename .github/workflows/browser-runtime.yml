name: One Browser Runtime
run-name: ${{ github.workflow }}

# Runs on a deploy/browser-runtime/<version> tag (scripts/release/trigger.sh)
# whose message pins the exact One Browser Chromium commit. Chromium is built
# locally; this workflow only verifies the packages staged in the private
# release runtime-v<version> and republishes them publicly.
'on':
  push:
    tags: ["deploy/browser-runtime/*"]

permissions:
  contents: read

concurrency:
  group: one-browser-runtime-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve fixed release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.source.outputs.version }}
      chromium_sha: ${{ steps.source.outputs.chromium_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: Checkout exact Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/github
          sparse-checkout-cone-mode: false

      - name: Read deploy tag
        id: trigger
        shell: bash
        working-directory: action
        run: bash scripts/github/read-trigger.sh browser-runtime chromium_ref >>"$GITHUB_OUTPUT"

      - name: Validate release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACTION_TOKEN: ${{ github.token }}
          CHROMIUM_REPOSITORY: voiceofhu/one-browser-chromium
          CHROMIUM_SHA: ${{ steps.trigger.outputs.chromium_ref }}
          VERSION: ${{ steps.trigger.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::GH_TOKEN is not configured' >&2; exit 1; }
          # The pinned commit must already be on the source main branch.
          status="$(gh api "repos/$CHROMIUM_REPOSITORY/compare/$CHROMIUM_SHA...main" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]] || {
            echo "chromium_ref $CHROMIUM_SHA is not on $CHROMIUM_REPOSITORY main ($status)." >&2
            exit 1
          }
          gh release view "runtime-v$VERSION" --repo "$CHROMIUM_REPOSITORY" --json tagName >/dev/null || {
            echo "Staging release runtime-v$VERSION is missing in $CHROMIUM_REPOSITORY." >&2
            exit 1
          }
          release_tag="one-browser-runtime-v$VERSION"
          release_file="$RUNNER_TEMP/one-browser-runtime-existing-release.json"
          if GH_TOKEN="$ACTION_TOKEN" gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" >"$release_file"; then
            echo "Release $release_tag already exists; choose a new VERSION." >&2
            exit 1
          elif ! jq -e '.status == "404" or .status == 404' "$release_file" >/dev/null; then
            echo 'Unable to verify Runtime release availability; refusing to publish.' >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'chromium_sha=%s\n' "$CHROMIUM_SHA"
            printf 'release_tag=%s\n' "$release_tag"
          } >>"$GITHUB_OUTPUT"

  publish:
    name: Publish immutable Runtime release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact Action release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false

      - name: Download staged packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CHROMIUM_REPOSITORY: voiceofhu/one-browser-chromium
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          mkdir staging
          gh release download "runtime-v$VERSION" \
            --repo "$CHROMIUM_REPOSITORY" \
            --dir staging
          ls -l staging

      - name: Verify packages and write checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHROMIUM_REF: ${{ needs.prepare.outputs.chromium_sha }}
        run: |
          set -Eeuo pipefail
          mkdir release-assets
          bash action/scripts/release/browser-runtime-assets.sh \
            staging release-assets "$RUNNER_TEMP/one-browser-runtime-notes.md"
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          notes_file="$RUNNER_TEMP/one-browser-runtime-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it." >&2
            exit 1
          fi
          tag_file="$RUNNER_TEMP/one-browser-runtime-tag.json"
          tag_error="$RUNNER_TEMP/one-browser-runtime-tag.err"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$tag_file" 2>"$tag_error"; then
            jq -e --arg sha "$GITHUB_SHA" \
              '.object.type == "commit" and .object.sha == $sha' "$tag_file" >/dev/null || {
              echo "Release tag $RELEASE_TAG points elsewhere; refusing to move it." >&2
              exit 1
            }
          elif jq -e '.status == "404" or .status == 404' "$tag_file" >/dev/null; then
            echo "Release tag $RELEASE_TAG does not exist yet; creating it."
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >"$tag_file"
          else
            cat "$tag_error" >&2
            echo 'Unable to verify Runtime release tag; refusing to publish.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$tag_file"
          jq -e --arg sha "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $sha' "$tag_file" >/dev/null
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "One Browser Runtime $VERSION" \
            --notes-file "$notes_file" \
            --latest=false
          expected_assets="$(cd release-assets && printf '%s\n' * | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo "Published assets differ from the verified set." >&2
            exit 1
          }
          printf 'Published %s with assets:\n' "$RELEASE_TAG"
          printf '  %s\n' release-assets/*
