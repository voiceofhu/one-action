name: One Browser App Egress

'on':
  workflow_dispatch:
    inputs:
      expected_action_sha: {required: true, type: string}
      confirmation: {required: true, type: string}
      egress_repository: {required: true, type: string}
      egress_ref: {required: true, type: string}
      version: {required: true, type: string}
      environment: {required: true, type: string}
      publish: {required: true, type: boolean}
      deploy: {required: true, type: boolean}

permissions:
  contents: write
  packages: write

concurrency:
  group: one-browser-app-egress-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact Egress source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      egress_sha: ${{ steps.release.outputs.egress_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Validate dispatched release source
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EGRESS_REPOSITORY: ${{ inputs.egress_repository }}
          EGRESS_SHA: ${{ inputs.egress_ref }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH: ${{ inputs.publish }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$ACTION_SHA" == "$EXPECTED_ACTION_SHA" \
            && "$CONFIRMATION" == "enable:egress:$ACTION_SHA" \
            && "$EGRESS_REPOSITORY" == voiceofhu/one-browser-egress \
            && "$EGRESS_SHA" =~ ^[0-9a-f]{40}$ \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && "$ENVIRONMENT" == prod \
            && "$PUBLISH" == true \
            && "$DEPLOY" == false \
            && -n "$GH_TOKEN" ]] || {
            echo 'Invalid One Browser App Egress dispatch inputs or Action trust root.' >&2
            exit 1
          }
          commit_file="$RUNNER_TEMP/one-browser-egress-commit.json"
          gh api "repos/$EGRESS_REPOSITORY/commits/$EGRESS_SHA" >"$commit_file"
          [[ "$(jq -er .sha "$commit_file")" == "$EGRESS_SHA" ]]
          printf 'egress_sha=%s\n' "$EGRESS_SHA" >>"$GITHUB_OUTPUT"
          printf 'release_tag=one-browser-egress-v%s\n' "$VERSION" >>"$GITHUB_OUTPUT"

  build:
    name: Build and upload linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout exact Egress source
        uses: actions/checkout@v4
        with:
          repository: voiceofhu/one-browser-egress
          ref: ${{ needs.prepare.outputs.egress_sha }}
          path: egress
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install source-declared Rust toolchain
        working-directory: egress
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -Eeuo pipefail
          toolchain="$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)"
          [[ "$toolchain" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --target "$RUST_TARGET" \
            --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >>"$GITHUB_ENV"
          rustc --version
          rustup target list --installed | grep -Fx "$RUST_TARGET"

      - name: Install musl toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build static native binary
        working-directory: egress
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo build --release --locked --target "$RUST_TARGET"

      - name: Stage native asset
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -Eeuo pipefail
          install -D -m 0755 \
            "egress/target/$RUST_TARGET/release/one-browser-egress" \
            "dist/one-browser-egress-linux-$ARCH"
          file "dist/one-browser-egress-linux-$ARCH" | grep -q 'static'

      - name: Upload native asset
        uses: actions/upload-artifact@v4
        with:
          name: one-browser-egress-linux-${{ matrix.arch }}
          path: dist/one-browser-egress-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build architecture image
        uses: docker/build-push-action@v6
        with:
          context: egress
          file: egress/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/voiceofhu/one-browser-egress:build-${{ needs.prepare.outputs.egress_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/voiceofhu/one-browser-egress
            org.opencontainers.image.revision=${{ needs.prepare.outputs.egress_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            one.action.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=one-browser-egress-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=one-browser-egress-${{ matrix.arch }}

  release:
    name: Publish immutable Egress release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          pattern: one-browser-egress-linux-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          EGRESS_SHA: ${{ needs.prepare.outputs.egress_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum one-browser-egress-linux-amd64 one-browser-egress-linux-arm64 >SHA256SUMS)
          tar -C dist -czf "dist/one-browser-egress-$VERSION.tar.gz" \
            one-browser-egress-linux-amd64 one-browser-egress-linux-arm64 SHA256SUMS
          (cd dist && sha256sum "one-browser-egress-$VERSION.tar.gz" >>SHA256SUMS)
          body="One Browser Egress source: voiceofhu/one-browser-egress@$EGRESS_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "One Browser Egress v$VERSION" \
            --notes "$body"

  manifest:
    name: Publish immutable Egress image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Publish version and revision manifests
        shell: bash
        env:
          ACTION_SHA: ${{ github.sha }}
          EGRESS_SHA: ${{ needs.prepare.outputs.egress_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/voiceofhu/one-browser-egress
          version_ref="$image:$VERSION"
          revision_ref="$image:sha-$EGRESS_SHA"
          if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1 ||
             docker buildx imagetools inspect "$revision_ref" >/dev/null 2>&1; then
            echo 'Egress version or revision image already exists; refusing to mutate it.' >&2
            exit 1
          fi
          candidate="$image:build-$EGRESS_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --annotation "index:one.action.revision=$ACTION_SHA" \
            --annotation "index:org.opencontainers.image.revision=$EGRESS_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --tag "$candidate" \
            "$candidate-amd64" "$candidate-arm64"
          docker buildx imagetools create --tag "$version_ref" --tag "$revision_ref" "$candidate"
