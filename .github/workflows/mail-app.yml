name: One Mail App
run-name: ${{ github.workflow }}

# Runs on deploy/mail-app/<version> tags pushed by `make deploy-mail-app`.
'on':
  push:
    tags: ["deploy/mail-app/*"]

permissions:
  contents: read

concurrency:
  group: one-mail-app-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-publish-tauri-app.yml
    with:
      app: mail
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # In-app updates: minisign key for the updater bundles (apps.json updater_config).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ONE_MAIL_APP_UPDATER_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ONE_MAIL_APP_UPDATER_KEY_PASSWORD }}
