name: One Node Runtime
run-name: ${{ github.workflow }}

# Runs on a deploy/node-runtime/<version> tag (scripts/release/trigger.sh)
# whose message pins the exact One Node commit.
'on':
  push:
    tags: ["deploy/node-runtime/*"]

permissions:
  contents: read

concurrency:
  group: one-node-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve fixed release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.source.outputs.version }}
      node_sha: ${{ steps.source.outputs.node_sha }}
      action_sha: ${{ steps.source.outputs.action_sha }}
      xray_version: ${{ steps.source.outputs.xray_version }}
      hysteria_version: ${{ steps.source.outputs.hysteria_version }}
    steps:
      - name: Checkout exact Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/github
          sparse-checkout-cone-mode: false

      - name: Read deploy tag
        id: trigger
        shell: bash
        working-directory: action
        run: bash scripts/github/read-trigger.sh node-runtime node_ref >>"$GITHUB_OUTPUT"

      - name: Resolve exact One Node source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_REPOSITORY: voiceofhu/one-node-node
          NODE_SHA: ${{ steps.trigger.outputs.node_ref }}
          VERSION: ${{ steps.trigger.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]]
          # The embedded data plane cores are plain Go dependencies of the
          # Node module; record the versions its go.mod pins.
          go_mod="$(gh api "repos/$NODE_REPOSITORY/contents/go.mod?ref=$NODE_SHA" --jq .content |
            base64 --decode | tr -d '\r')"
          module_version() {
            awk -v module="$1" '$1 == "require" { $1 = ""; $0 = substr($0, 2) } $1 == module { print $2; exit }' <<<"$go_mod"
          }
          xray_version="$(module_version github.com/xtls/xray-core)"
          hysteria_version="$(module_version github.com/apernet/hysteria/core/v2)"
          [[ "$xray_version" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
          [[ "$hysteria_version" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]

          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          printf 'node_sha=%s\n' "$NODE_SHA" >>"$GITHUB_OUTPUT"
          printf 'action_sha=%s\n' "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          printf 'xray_version=%s\n' "$xray_version" >>"$GITHUB_OUTPUT"
          printf 'hysteria_version=%s\n' "$hysteria_version" >>"$GITHUB_OUTPUT"

  build:
    name: Build and upload linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact One Node source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: voiceofhu/one-node-node
          ref: ${{ needs.prepare.outputs.node_sha }}
          path: node
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up source-declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: node/go.mod
          cache: false

      - name: Build Linux binary
        working-directory: node
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.node_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          make --no-print-directory "build-linux-$ARCH" \
            ONE_NODE_VERSION="$VERSION" \
            ONE_NODE_COMMIT="$SOURCE_SHA"

      - name: Upload Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: one-node-linux-${{ matrix.arch }}
          path: node/dist/one-node-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: node
          file: node/one/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/voiceofhu/one-node:build-${{ needs.prepare.outputs.node_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/voiceofhu/one-node-node
            org.opencontainers.image.revision=${{ needs.prepare.outputs.node_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.one-node.xray.version=${{ needs.prepare.outputs.xray_version }}
            io.one-node.hysteria.version=${{ needs.prepare.outputs.hysteria_version }}
          provenance: false
          sbom: false

  publish-image:
    name: Publish immutable OCI image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Publish immutable version tag
        shell: bash
        env:
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/voiceofhu/one-node
          candidate="$image:build-$NODE_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          inspect_raw() {
            local target=$1 output error_file attempt
            error_file="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect --raw "$target" 2>"$error_file")"; then
                rm -f -- "$error_file"
                printf '%s\n' "$output"
                return 0
              fi
              if [[ "$attempt" == 5 ]]; then
                printf 'Could not read back OCI image %s after %s attempts:\n' \
                  "$target" "$attempt" >&2
                cat "$error_file" >&2
                rm -f -- "$error_file"
                return 1
              fi
              printf 'OCI image %s is not readable yet; retrying (%s/5).\n' \
                "$target" "$attempt" >&2
              sleep 2
            done
          }

          fingerprint() {
            inspect_raw "$1" |
              jq -er '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.architecture)=\(.digest)"] | sort | if length == 2 then join(",") else error("expected two Linux architectures") end'
          }

          docker buildx imagetools create \
            --tag "$candidate" \
            "$candidate-amd64" \
            "$candidate-arm64"
          candidate_fingerprint="$(fingerprint "$candidate")"
          version_ref="$image:$VERSION"
          version_exists=false
          docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1 && version_exists=true

          verify_final() {
            local target=$1
            inspect_raw "$target" |
              jq -e --arg version "$VERSION" \
                '.annotations["org.opencontainers.image.version"] == $version' >/dev/null
          }

          if [[ "$version_exists" == true ]]; then
            verify_final "$version_ref"
            printf 'Version image %s already exists; keeping it unchanged.\n' "$version_ref"
          else
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --tag "$version_ref" \
              "$candidate"
            verify_final "$version_ref"
            [[ "$(fingerprint "$version_ref")" == "$candidate_fingerprint" ]]
          fi

  upload-release:
    name: Upload draft GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: one-node-linux-*
          path: dist
          merge-multiple: true

      - name: Checkout exact Action installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.action_sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: node
          sparse-checkout-cone-mode: false

      - name: Create release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod 0755 dist/one-node-linux-amd64 dist/one-node-linux-arm64
          (cd dist && sha256sum one-node-linux-amd64 one-node-linux-arm64 >SHA256SUMS)

      # SHA256SUMS lists the binaries plus every installer file at the release
      # commit; nodes refuse a release whose SHA256SUMS.sig does not verify
      # against the public key embedded in node/scripts/shared/bootstrap.sh.
      - name: Sign release checksums
        shell: bash
        env:
          ONE_NODE_RELEASE_SIGNING_KEY: ${{ secrets.ONE_NODE_RELEASE_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$ONE_NODE_RELEASE_SIGNING_KEY" ]]; then
            printf '%s\n' '::error::ONE_NODE_RELEASE_SIGNING_KEY is not configured' >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/one-node-release-signing.pem"
          trap 'rm -f -- "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$ONE_NODE_RELEASE_SIGNING_KEY" >"$key_file")
          sh action/node/scripts/sign-release.sh dist "$key_file"

      - name: Create or resume GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          ACTION_SHA: ${{ needs.prepare.outputs.action_sha }}
          RELEASE_TAG: one-node-v${{ needs.prepare.outputs.version }}
          XRAY_VERSION: ${{ needs.prepare.outputs.xray_version }}
          HYSTERIA_VERSION: ${{ needs.prepare.outputs.hysteria_version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          if tag_sha="$(gh api "repos/voiceofhu/one-action/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
            [[ "$tag_sha" == "$ACTION_SHA" ]]
          else
            gh api --method POST repos/voiceofhu/one-action/git/refs \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$ACTION_SHA" >/dev/null
          fi
          expected_assets=$'SHA256SUMS\nSHA256SUMS.sig\none-node-linux-amd64\none-node-linux-arm64'
          notes="$(printf 'Node source: voiceofhu/one-node-node@%s\nData plane: Xray-core %s + Hysteria2 core %s\nDocker image: ghcr.io/voiceofhu/one-node:%s' \
            "$NODE_SHA" "$XRAY_VERSION" "$HYSTERIA_VERSION" "$VERSION")"

          verify_assets() {
            local directory=$1
            for asset in SHA256SUMS SHA256SUMS.sig one-node-linux-amd64 one-node-linux-arm64; do
              cmp -s "dist/$asset" "$directory/$asset"
            done
          }

          if release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease 2>/dev/null)"; then
            jq -e --arg body "$notes" '.body == $body and .isPrerelease == false' \
              <<<"$release_json" >/dev/null
            actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
            if [[ "$(jq -r .isDraft <<<"$release_json")" == false ]]; then
              [[ "$actual_assets" == "$expected_assets" ]]
              existing_dir="$(mktemp -d)"
              trap 'rm -rf "$existing_dir"' EXIT
              gh release download "$RELEASE_TAG" --repo voiceofhu/one-action --dir "$existing_dir"
              verify_assets "$existing_dir"
              exit 0
            fi
            while IFS= read -r asset; do
              case "$asset" in
                ''|SHA256SUMS|SHA256SUMS.sig|one-node-linux-amd64|one-node-linux-arm64) ;;
                *) printf 'Unexpected draft Release asset: %s\n' "$asset" >&2; exit 1 ;;
              esac
            done <<<"$actual_assets"
          else
            gh release create "$RELEASE_TAG" \
              --repo voiceofhu/one-action \
              --verify-tag \
              --draft \
              --title one-node \
              --notes "$notes" \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" \
            dist/SHA256SUMS dist/one-node-linux-amd64 dist/one-node-linux-arm64 dist/SHA256SUMS.sig \
            --repo voiceofhu/one-action \
            --clobber
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT
          gh release download "$RELEASE_TAG" --repo voiceofhu/one-action --dir "$readback_dir"
          verify_assets "$readback_dir"
          release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          jq -e --arg body "$notes" \
            '.body == $body and .isDraft == true and .isPrerelease == false' \
            <<<"$release_json" >/dev/null
          [[ "$actual_assets" == "$expected_assets" ]]

  publish-release:
    name: Publish verified GitHub Release
    needs:
      - prepare
      - publish-image
      - upload-release
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          RELEASE_TAG: one-node-v${{ needs.prepare.outputs.version }}
          XRAY_VERSION: ${{ needs.prepare.outputs.xray_version }}
          HYSTERIA_VERSION: ${{ needs.prepare.outputs.hysteria_version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          expected_assets=$'SHA256SUMS\nSHA256SUMS.sig\none-node-linux-amd64\none-node-linux-arm64'
          notes="$(printf 'Node source: voiceofhu/one-node-node@%s\nData plane: Xray-core %s + Hysteria2 core %s\nDocker image: ghcr.io/voiceofhu/one-node:%s' \
            "$NODE_SHA" "$XRAY_VERSION" "$HYSTERIA_VERSION" "$VERSION")"
          gh release edit "$RELEASE_TAG" \
            --repo voiceofhu/one-action \
            --draft=false \
            --latest=false
          release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          jq -e --arg body "$notes" \
            '.body == $body and .isDraft == false and .isPrerelease == false' \
            <<<"$release_json" >/dev/null
          [[ "$actual_assets" == "$expected_assets" ]]
