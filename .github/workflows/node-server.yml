name: One Node Server

'on':
  push:
    tags:
      - 'node-server-v*'

permissions:
  contents: read

concurrency:
  group: one-node-server-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact release sources
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      web_sha: ${{ steps.release.outputs.web_sha }}
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
    steps:
      - name: Resolve fixed source tags
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$ACTION_SHA" =~ ^[0-9a-f]{40}$ \
            && "$TAG_NAME" =~ ^node-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && -n "$GH_TOKEN" ]] || {
            echo 'Invalid One Node Server release tag or Action trust root.' >&2
            exit 1
          }
          version=${TAG_NAME#node-server-v}
          source_tag="v$version"
          backend_commit_file="$RUNNER_TEMP/one-node-server-backend-commit.json"
          web_commit_file="$RUNNER_TEMP/one-node-server-web-commit.json"
          gh api "repos/voiceofhu/one-node-server/commits/$source_tag" >"$backend_commit_file" &
          backend_pid=$!
          gh api "repos/voiceofhu/one-node-web/commits/$source_tag" >"$web_commit_file" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
          backend_sha="$(jq -er .sha "$backend_commit_file")"
          web_sha="$(jq -er .sha "$web_commit_file")"
          created_at="$(jq -er '.commit.committer.date' "$web_commit_file")"
          [[ "$backend_sha" =~ ^[0-9a-f]{40}$ && "$web_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'One Node Server source tags did not resolve to exact commit SHAs.' >&2
            exit 1
          }
          [[ "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          printf 'backend_sha=%s\n' "$backend_sha" >>"$GITHUB_OUTPUT"
          printf 'web_sha=%s\n' "$web_sha" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-web-backend.yml
    with:
      workflow_name: one-node-server
      action_sha: ${{ github.sha }}
      backend_sha: ${{ needs.prepare.outputs.backend_sha }}
      web_sha: ${{ needs.prepare.outputs.web_sha }}
      version: ${{ needs.prepare.outputs.version }}
      created_at: ${{ needs.prepare.outputs.created_at }}
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}
