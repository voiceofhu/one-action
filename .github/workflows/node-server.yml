name: One Node Server

'on':
  push:
    tags:
      - 'node-server-v*'

permissions:
  contents: read

concurrency:
  group: one-node-server-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact release sources
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      web_sha: ${{ steps.release.outputs.web_sha }}
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
    steps:
      - name: Resolve exact sources from control tag
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$ACTION_SHA" =~ ^[0-9a-f]{40}$ \
            && "$TAG_NAME" =~ ^node-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && -n "$GH_TOKEN" ]] || {
            echo 'Invalid One Node Server release tag or Action trust root.' >&2
            exit 1
          }
          version=${TAG_NAME#node-server-v}
          tag_ref_file="$RUNNER_TEMP/one-node-server-control-ref.json"
          tag_object_file="$RUNNER_TEMP/one-node-server-control-tag.json"
          backend_commit_file="$RUNNER_TEMP/one-node-server-backend-commit.json"
          web_commit_file="$RUNNER_TEMP/one-node-server-web-commit.json"
          gh api "repos/$ACTION_REPOSITORY/git/ref/tags/$TAG_NAME" >"$tag_ref_file"
          tag_object_type="$(jq -er .object.type "$tag_ref_file")"
          tag_object_sha="$(jq -er .object.sha "$tag_ref_file")"
          [[ "$tag_object_type" == tag && "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'One Node Server control tag must be annotated.' >&2
            exit 1
          }
          gh api "repos/$ACTION_REPOSITORY/git/tags/$tag_object_sha" >"$tag_object_file"
          tag_target_type="$(jq -er .object.type "$tag_object_file")"
          tag_target_sha="$(jq -er .object.sha "$tag_object_file")"
          [[ "$tag_target_type" == commit && "$tag_target_sha" == "$ACTION_SHA" ]] || {
            echo 'One Node Server control tag target does not match the workflow Action SHA.' >&2
            exit 1
          }
          tag_message="$(jq -er .message "$tag_object_file")"
          manifest_field() {
            local key=$1 matches
            matches="$(printf '%s\n' "$tag_message" | sed -n "s/^${key}=//p")"
            [[ -n "$matches" && "$(printf '%s\n' "$matches" | wc -l | tr -d ' ')" == 1 ]] || return 1
            printf '%s\n' "$matches"
          }
          format="$(manifest_field format)"
          manifest_version="$(manifest_field version)"
          backend_sha="$(manifest_field backend_sha)"
          web_sha="$(manifest_field web_sha)"
          [[ "$format" == one-node-server-release-v1 \
            && "$manifest_version" == "$version" \
            && "$backend_sha" =~ ^[0-9a-f]{40}$ \
            && "$web_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid One Node Server control tag manifest.' >&2
            exit 1
          }
          gh api "repos/voiceofhu/one-node-server/commits/$backend_sha" >"$backend_commit_file" &
          backend_pid=$!
          gh api "repos/voiceofhu/one-node-web/commits/$web_sha" >"$web_commit_file" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
          [[ "$(jq -er .sha "$backend_commit_file")" == "$backend_sha" \
            && "$(jq -er .sha "$web_commit_file")" == "$web_sha" ]] || {
            echo 'One Node Server manifest source commits did not resolve exactly.' >&2
            exit 1
          }
          created_at="$(jq -er '.commit.committer.date' "$web_commit_file")"
          [[ "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          printf 'backend_sha=%s\n' "$backend_sha" >>"$GITHUB_OUTPUT"
          printf 'web_sha=%s\n' "$web_sha" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-web-backend.yml
    with:
      workflow_name: one-node-server
      action_sha: ${{ github.sha }}
      backend_sha: ${{ needs.prepare.outputs.backend_sha }}
      web_sha: ${{ needs.prepare.outputs.web_sha }}
      version: ${{ needs.prepare.outputs.version }}
      created_at: ${{ needs.prepare.outputs.created_at }}
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Deploy One Node Server image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: one-node-prod
      url: ${{ vars.DEPLOY_URL || 'https://marseo.eu.org' }}
    concurrency:
      group: one-node-server-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Server deployment file
        uses: actions/checkout@v4
        with:
          repository: voiceofhu/one-node-server
          ref: ${{ needs.prepare.outputs.backend_sha }}
          path: server
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-node-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh

      - name: Log server in to GitHub Container Registry
        id: registry_login
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: exec bash action/scripts/deploy/registry-auth.sh

      - name: Deploy versioned image
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/opt/one-node' }}
          DOCKER_IMAGE: ${{ needs.publish.outputs.image_ref }}
          COMPOSE_FILE: server/deployments/docker-compose.yml
          PUBLIC_URL: ${{ vars.DEPLOY_URL || 'https://marseo.eu.org' }}
        run: exec bash action/scripts/deploy/deploy-node-server.sh

      - name: Log server out of GitHub Container Registry
        if: ${{ always() && steps.registry_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          REGISTRY_ACTION: logout
        run: exec bash action/scripts/deploy/registry-auth.sh
