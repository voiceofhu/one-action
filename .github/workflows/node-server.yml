name: One Node Server

'on':
  workflow_dispatch:
    inputs:
      expected_action_sha: {required: true, type: string}
      confirmation: {required: true, type: string}
      backend_repository: {required: true, type: string}
      backend_ref: {required: true, type: string}
      web_repository: {required: true, type: string}
      web_ref: {required: true, type: string}
      version: {required: true, type: string}
      publish: {required: true, type: boolean}
      deploy: {required: true, type: boolean}

permissions:
  contents: read

concurrency:
  group: one-node-server-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact release sources
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      web_sha: ${{ steps.release.outputs.web_sha }}
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
    steps:
      - name: Validate dispatched release sources
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_REPOSITORY: ${{ inputs.backend_repository }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          WEB_REPOSITORY: ${{ inputs.web_repository }}
          WEB_SHA: ${{ inputs.web_ref }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$ACTION_SHA" == "$EXPECTED_ACTION_SHA" \
            && "$CONFIRMATION" == "enable:one-node-server:$ACTION_SHA" \
            && "$BACKEND_REPOSITORY" == voiceofhu/one-node-server \
            && "$WEB_REPOSITORY" == voiceofhu/one-node-web \
            && "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ \
            && "$WEB_SHA" =~ ^[0-9a-f]{40}$ \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && "$PUBLISH" == true \
            && "$DEPLOY" == true \
            && -n "$GH_TOKEN" ]] || {
            echo 'Invalid One Node Server dispatch inputs or Action trust root.' >&2
            exit 1
          }
          backend_commit_file="$RUNNER_TEMP/one-node-server-backend-commit.json"
          web_commit_file="$RUNNER_TEMP/one-node-server-web-commit.json"
          gh api "repos/$BACKEND_REPOSITORY/commits/$BACKEND_SHA" >"$backend_commit_file" &
          backend_pid=$!
          gh api "repos/$WEB_REPOSITORY/commits/$WEB_SHA" >"$web_commit_file" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
          [[ "$(jq -er .sha "$backend_commit_file")" == "$BACKEND_SHA" \
            && "$(jq -er .sha "$web_commit_file")" == "$WEB_SHA" ]] || {
            echo 'One Node Server dispatch source SHAs could not be verified.' >&2
            exit 1
          }
          created_at="$(jq -er '.commit.committer.date' "$web_commit_file")"
          [[ "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          printf 'backend_sha=%s\n' "$BACKEND_SHA" >>"$GITHUB_OUTPUT"
          printf 'web_sha=%s\n' "$WEB_SHA" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-web-backend.yml
    with:
      workflow_name: one-node-server
      action_sha: ${{ github.sha }}
      backend_sha: ${{ needs.prepare.outputs.backend_sha }}
      web_sha: ${{ needs.prepare.outputs.web_sha }}
      version: ${{ needs.prepare.outputs.version }}
      created_at: ${{ needs.prepare.outputs.created_at }}
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Deploy One Node Server image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: one-node-prod
      url: ${{ vars.DEPLOY_URL || 'https://marseo.eu.org' }}
    concurrency:
      group: one-node-server-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Server deployment file
        uses: actions/checkout@v4
        with:
          repository: voiceofhu/one-node-server
          ref: ${{ needs.prepare.outputs.backend_sha }}
          path: server
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-node-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh

      - name: Log server in to GitHub Container Registry
        id: registry_login
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: exec bash action/scripts/deploy/registry-auth.sh

      - name: Deploy versioned image
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/opt/one-node' }}
          DOCKER_IMAGE: ${{ needs.publish.outputs.image_ref }}
          COMPOSE_FILE: server/deploy/docker-compose.yml
          PUBLIC_URL: ${{ vars.DEPLOY_URL || 'https://marseo.eu.org' }}
        run: exec bash action/scripts/deploy/deploy-node-server.sh

      - name: Log server out of GitHub Container Registry
        if: ${{ always() && steps.registry_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: one-node-deploy
          REGISTRY_ACTION: logout
        run: exec bash action/scripts/deploy/registry-auth.sh
