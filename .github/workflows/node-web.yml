name: One Node Web
run-name: ${{ github.workflow }}

# Runs on deploy/node-web/<version> tags pushed by `make deploy-node-web`.
"on":
  push:
    tags: ["deploy/node-web/*"]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/reusable-deploy-web.yml
    with:
      product: node
      pc_bundle: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # The app's downloaded /pc pages are signed with the in-app updater key.
      APP_UPDATER_KEY: ${{ secrets.ONE_NODE_APP_UPDATER_KEY }}
      APP_UPDATER_KEY_PASSWORD: ${{ secrets.ONE_NODE_APP_UPDATER_KEY_PASSWORD }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
