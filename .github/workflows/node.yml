name: One Node

'on':
  workflow_dispatch:
    inputs:
      expected_action_sha:
        description: Dispatcher-resolved exact central Action commit SHA
        required: true
        type: string
      node_repository:
        description: Fixed migration-period One Node source repository
        required: true
        type: string
      node_ref:
        description: Dispatcher-resolved exact One Node source commit SHA
        required: true
        type: string
      version:
        description: Optional x.y.z guard; empty reads VERSION from the exact source
        required: false
        type: string
      publish:
        description: Reserved; true fails closed until protected central publication is implemented
        required: false
        type: boolean
        default: false
      deploy:
        description: Reserved; true always fails closed because deployment is not implemented
        required: false
        type: boolean
        default: false
      confirmation:
        description: Reserved dispatcher-owned publication confirmation
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/reusable-prepare.yml
    with:
      workflow_name: node
      expected_action_sha: ${{ inputs.expected_action_sha }}
      primary_label: node
      primary_repository: ${{ inputs.node_repository }}
      primary_ref: ${{ inputs.node_ref }}
      version: ${{ inputs.version }}
      environment: dev
      publish: ${{ inputs.publish }}
      publish_supported: false
      deploy: ${{ inputs.deploy }}
      confirmation: ${{ inputs.confirmation }}
    secrets:
      source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-build-node.yml
    with:
      action_sha: ${{ github.sha }}
      source_repository: ${{ inputs.node_repository }}
      source_sha: ${{ needs.prepare.outputs.primary_sha }}
      version: ${{ inputs.version }}
    secrets:
      source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
