name: One Node

'on':
  push:
    tags:
      - 'one-node-v*'
  workflow_dispatch:
    inputs:
      expected_action_sha:
        description: Dispatcher-resolved exact central Action commit SHA
        required: true
        type: string
      node_repository:
        description: Fixed migration-period One Node source repository
        required: true
        type: string
      node_ref:
        description: Dispatcher-resolved exact One Node source commit SHA
        required: true
        type: string
      version:
        description: Optional x.y.z guard; empty reads VERSION from the exact source
        required: false
        type: string
      publish:
        description: Publish immutable Node image and Action release
        required: false
        type: boolean
        default: false
      deploy:
        description: Reserved; Node hosts install or upgrade through the published lifecycle scripts
        required: false
        type: boolean
        default: false
      confirmation:
        description: Reserved dispatcher-owned publication confirmation
        required: false
        type: string

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expected_action_sha: ${{ steps.normalize.outputs.expected_action_sha }}
      node_repository: ${{ steps.normalize.outputs.node_repository }}
      node_ref: ${{ steps.normalize.outputs.node_ref }}
      version: ${{ steps.normalize.outputs.version }}
      publish: ${{ steps.normalize.outputs.publish }}
      confirmation: ${{ steps.normalize.outputs.confirmation }}
    steps:
      - name: Checkout exact workflow tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize release inputs
        id: normalize
        shell: bash
        env:
          ACTION_SHA: ${{ github.sha }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
          INPUT_EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          INPUT_NODE_REF: ${{ inputs.node_ref }}
          INPUT_NODE_REPOSITORY: ${{ inputs.node_repository }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          emit_output() {
            local name=$1 value=$2
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
            printf '%s=%s\n' "$name" "$value" >>"$GITHUB_OUTPUT"
          }

          [[ "$GITHUB_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$ACTION_SHA" =~ ^[0-9a-f]{40}$ \
            && "$(git -C action rev-parse HEAD)" == "$ACTION_SHA" ]] || {
            echo 'One Node release has an invalid Action trust root.' >&2
            exit 1
          }

          case "$EVENT_NAME" in
            push)
              [[ "$TAG_NAME" =~ ^one-node-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo 'Release tag must use one-node-v<major>.<minor>.<patch>.' >&2
                exit 1
              }
              version=${TAG_NAME#one-node-v}
              expected_action_sha=$ACTION_SHA
              node_repository=voiceofhu/one-node-node
              node_ref="$(gh api "repos/$node_repository/commits/v$version" --jq .sha)"
              publish=true
              confirmation="enable:node:$ACTION_SHA"
              ;;
            workflow_dispatch)
              [[ "$INPUT_DEPLOY" == false ]] || {
                echo 'One Node host deployment is not performed by this workflow.' >&2
                exit 1
              }
              expected_action_sha=$INPUT_EXPECTED_ACTION_SHA
              node_repository=$INPUT_NODE_REPOSITORY
              node_ref=$INPUT_NODE_REF
              version=$INPUT_VERSION
              publish=$INPUT_PUBLISH
              confirmation=$INPUT_CONFIRMATION
              ;;
            *) echo "Unsupported workflow event: $EVENT_NAME" >&2; exit 1 ;;
          esac

          [[ "$expected_action_sha" == "$ACTION_SHA" \
            && "$node_repository" == voiceofhu/one-node-node \
            && "$node_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'One Node release inputs are invalid.' >&2
            exit 1
          }
          [[ -z "$version" || "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$publish" == true || "$publish" == false ]]
          if [[ "$publish" == true ]]; then
            [[ -n "$version" && "$confirmation" == "enable:node:$ACTION_SHA" ]]
          else
            [[ -z "$confirmation" ]]
          fi

          emit_output expected_action_sha "$expected_action_sha"
          emit_output node_repository "$node_repository"
          emit_output node_ref "$node_ref"
          emit_output version "$version"
          emit_output publish "$publish"
          emit_output confirmation "$confirmation"

  build:
    needs: normalize
    uses: ./.github/workflows/reusable-build-node.yml
    with:
      action_sha: ${{ needs.normalize.outputs.expected_action_sha }}
      source_repository: ${{ needs.normalize.outputs.node_repository }}
      source_sha: ${{ needs.normalize.outputs.node_ref }}
      version: ${{ needs.normalize.outputs.version }}
      publish: ${{ needs.normalize.outputs.publish == 'true' }}
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}

  publish:
    name: Publish immutable One Node image and release
    if: needs.normalize.outputs.publish == 'true'
    needs:
      - normalize
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    concurrency:
      group: one-node-publish
      cancel-in-progress: false
    steps:
      - name: Checkout exact Action tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.normalize.outputs.expected_action_sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Node source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.normalize.outputs.node_repository }}
          ref: ${{ needs.normalize.outputs.node_ref }}
          path: node
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact release assets
        uses: actions/download-artifact@v4
        with:
          name: node-release-${{ needs.normalize.outputs.node_ref }}
          path: dist

      - name: Validate exact release assets
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.source_version }}
        run: |
          set -Eeuo pipefail
          expected_assets=$'SHA256SUMS\none-node-linux-amd64\none-node-linux-arm64'
          actual_assets="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          (cd dist && sha256sum -c SHA256SUMS)
          chmod 0755 dist/one-node-linux-amd64 dist/one-node-linux-arm64
          [[ "$(dist/one-node-linux-amd64 version --product-name)" == "$VERSION" ]]
          mkdir -p node/dist
          cp dist/one-node-linux-amd64 node/dist/one-node-linux-amd64
          cp dist/one-node-linux-arm64 node/dist/one-node-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GitHub token identity
        id: github_identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.github_identity.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push immutable candidate image
        uses: docker/build-push-action@v6
        with:
          context: node
          file: node/one/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/voiceofhu/one-node:build-${{ needs.normalize.outputs.node_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=One Node
            org.opencontainers.image.description=One Node runtime agent
            org.opencontainers.image.source=https://github.com/voiceofhu/one-node-node
            org.opencontainers.image.documentation=https://github.com/voiceofhu/one-action
            org.opencontainers.image.revision=${{ needs.normalize.outputs.node_ref }}
            org.opencontainers.image.version=${{ needs.build.outputs.source_version }}
            io.one-node.upstream.version=${{ needs.build.outputs.upstream_version }}
            io.one-node.upstream.commit=${{ needs.build.outputs.upstream_commit }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/voiceofhu/one-node:buildcache
          cache-to: type=registry,ref=ghcr.io/voiceofhu/one-node:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Publish immutable revision and version tags
        shell: bash
        env:
          IMAGE: ghcr.io/voiceofhu/one-node
          IMAGE_REVISION_TAG: sha-${{ needs.normalize.outputs.node_ref }}
          IMAGE_VERSION: ${{ needs.build.outputs.source_version }}
          IMAGE_BUILD_TAG: build-${{ needs.normalize.outputs.node_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_SOURCE: https://github.com/voiceofhu/one-node-node
          IMAGE_DESCRIPTION: One Node runtime agent
          IMAGE_REVISION: ${{ needs.normalize.outputs.node_ref }}
          EXPECTED_VERSION: ${{ needs.build.outputs.source_version }}
          EXPECTED_COMMIT: ${{ needs.normalize.outputs.node_ref }}
          EXPECTED_UPSTREAM_VERSION: ${{ needs.build.outputs.upstream_version }}
          EXPECTED_UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          SHOULD_BUILD: 'true'
        run: exec bash action/scripts/release/publish-node-image.sh

      - name: Publish or verify immutable Action release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: one-node-v${{ needs.build.outputs.source_version }}
          NODE_SHA: ${{ needs.normalize.outputs.node_ref }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          VERSION: ${{ needs.build.outputs.source_version }}
        run: |
          set -Eeuo pipefail
          release_body="$(printf 'Node source: voiceofhu/one-node-node@%s\nUpstream: sing-box %s@%s\nDocker image: ghcr.io/voiceofhu/one-node:%s\nImmutable image: ghcr.io/voiceofhu/one-node:sha-%s' \
            "$NODE_SHA" "$UPSTREAM_VERSION" "$UPSTREAM_COMMIT" "$VERSION" "$NODE_SHA")"
          if existing_release="$(gh release view "$RELEASE_TAG" --json body,assets,isPrerelease 2>/dev/null)"; then
            jq -e --arg body "$release_body" '.isPrerelease == false and .body == $body' \
              <<<"$existing_release" >/dev/null
            [[ "$(jq -r '.assets[].name' <<<"$existing_release" | LC_ALL=C sort)" == \
              $'SHA256SUMS\none-node-linux-amd64\none-node-linux-arm64' ]]
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$RELEASE_TAG" --dir "$existing_dir"
            for asset in SHA256SUMS one-node-linux-amd64 one-node-linux-arm64; do
              cmp -s "dist/$asset" "$existing_dir/$asset"
            done
            printf 'Immutable One Node release %s already exists with identical bytes.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/SHA256SUMS dist/one-node-linux-amd64 dist/one-node-linux-arm64 \
            --target "${{ needs.normalize.outputs.expected_action_sha }}" \
            --title one-node \
            --notes "$release_body"
