name: One Node

'on':
  workflow_dispatch:
    inputs:
      expected_action_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      node_repository:
        required: true
        type: string
      node_ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-node-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve fixed release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.source.outputs.version }}
      node_sha: ${{ steps.source.outputs.node_sha }}
      action_sha: ${{ steps.source.outputs.action_sha }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
    steps:
      - name: Resolve exact One Node source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          NODE_REPOSITORY: ${{ inputs.node_repository }}
          NODE_SHA: ${{ inputs.node_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == voiceofhu/one-action ]]
          [[ -n "$GH_TOKEN" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_ACTION_SHA" ]]
          [[ "$CONFIRMATION" == "enable:node:$GITHUB_SHA" ]]
          [[ "$NODE_REPOSITORY" == voiceofhu/one-node-node ]]
          [[ "$NODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          read_source_file() {
            gh api "repos/$NODE_REPOSITORY/contents/$1?ref=$NODE_SHA" --jq .content |
              base64 --decode | tr -d '\r\n'
          }
          upstream_version="$(read_source_file one/version/UPSTREAM_VERSION)"
          upstream_commit="$(read_source_file one/version/UPSTREAM_COMMIT)"
          [[ "$upstream_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]

          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          printf 'node_sha=%s\n' "$NODE_SHA" >>"$GITHUB_OUTPUT"
          printf 'action_sha=%s\n' "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          printf 'upstream_version=%s\n' "$upstream_version" >>"$GITHUB_OUTPUT"
          printf 'upstream_commit=%s\n' "$upstream_commit" >>"$GITHUB_OUTPUT"

  build:
    name: Build and upload linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact One Node source
        uses: actions/checkout@v4
        with:
          repository: voiceofhu/one-node-node
          ref: ${{ needs.prepare.outputs.node_sha }}
          path: node
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up source-declared Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache: false

      - name: Build Linux binary
        working-directory: node
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.node_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
        run: |
          set -Eeuo pipefail
          make --no-print-directory "build-linux-$ARCH" \
            ONE_NODE_VERSION="$VERSION" \
            ONE_NODE_COMMIT="$SOURCE_SHA" \
            ONE_NODE_UPSTREAM_VERSION="$UPSTREAM_VERSION" \
            ONE_NODE_UPSTREAM_COMMIT="$UPSTREAM_COMMIT"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: one-node-linux-${{ matrix.arch }}
          path: node/dist/one-node-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: node
          file: node/one/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/voiceofhu/one-node:build-${{ needs.prepare.outputs.node_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/voiceofhu/one-node-node
            org.opencontainers.image.revision=${{ needs.prepare.outputs.node_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.one-node.upstream.version=${{ needs.prepare.outputs.upstream_version }}
            io.one-node.upstream.commit=${{ needs.prepare.outputs.upstream_commit }}
          provenance: false
          sbom: false

  publish-image:
    name: Publish immutable OCI image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Publish immutable version tag
        shell: bash
        env:
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/voiceofhu/one-node
          candidate="$image:build-$NODE_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          inspect_raw() {
            local target=$1 output error_file attempt
            error_file="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect --raw "$target" 2>"$error_file")"; then
                rm -f -- "$error_file"
                printf '%s\n' "$output"
                return 0
              fi
              if [[ "$attempt" == 5 ]]; then
                printf 'Could not read back OCI image %s after %s attempts:\n' \
                  "$target" "$attempt" >&2
                cat "$error_file" >&2
                rm -f -- "$error_file"
                return 1
              fi
              printf 'OCI image %s is not readable yet; retrying (%s/5).\n' \
                "$target" "$attempt" >&2
              sleep 2
            done
          }

          fingerprint() {
            inspect_raw "$1" |
              jq -er '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.architecture)=\(.digest)"] | sort | if length == 2 then join(",") else error("expected two Linux architectures") end'
          }

          docker buildx imagetools create \
            --tag "$candidate" \
            "$candidate-amd64" \
            "$candidate-arm64"
          candidate_fingerprint="$(fingerprint "$candidate")"
          version_ref="$image:$VERSION"
          version_exists=false
          docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1 && version_exists=true

          verify_final() {
            local target=$1
            inspect_raw "$target" |
              jq -e --arg version "$VERSION" \
                '.annotations["org.opencontainers.image.version"] == $version' >/dev/null
          }

          if [[ "$version_exists" == true ]]; then
            verify_final "$version_ref"
            printf 'Version image %s already exists; keeping it unchanged.\n' "$version_ref"
          else
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --tag "$version_ref" \
              "$candidate"
            verify_final "$version_ref"
            [[ "$(fingerprint "$version_ref")" == "$candidate_fingerprint" ]]
          fi

  upload-release:
    name: Upload draft GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: one-node-linux-*
          path: dist
          merge-multiple: true

      - name: Create release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod 0755 dist/one-node-linux-amd64 dist/one-node-linux-arm64
          (cd dist && sha256sum one-node-linux-amd64 one-node-linux-arm64 >SHA256SUMS)

      - name: Create or resume GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          ACTION_SHA: ${{ needs.prepare.outputs.action_sha }}
          RELEASE_TAG: one-node-v${{ needs.prepare.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          if tag_sha="$(gh api repos/voiceofhu/one-action/git/ref/tags/$RELEASE_TAG --jq .object.sha 2>/dev/null)"; then
            [[ "$tag_sha" == "$ACTION_SHA" ]]
          else
            gh api --method POST repos/voiceofhu/one-action/git/refs \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$ACTION_SHA" >/dev/null
          fi
          expected_assets=$'SHA256SUMS\none-node-linux-amd64\none-node-linux-arm64'
          notes="$(printf 'Node source: voiceofhu/one-node-node@%s\nUpstream: sing-box %s@%s\nDocker image: ghcr.io/voiceofhu/one-node:%s' \
            "$NODE_SHA" "$UPSTREAM_VERSION" "$UPSTREAM_COMMIT" "$VERSION")"

          verify_assets() {
            local directory=$1
            for asset in SHA256SUMS one-node-linux-amd64 one-node-linux-arm64; do
              cmp -s "dist/$asset" "$directory/$asset"
            done
          }

          if release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease 2>/dev/null)"; then
            jq -e --arg body "$notes" '.body == $body and .isPrerelease == false' \
              <<<"$release_json" >/dev/null
            actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
            if [[ "$(jq -r .isDraft <<<"$release_json")" == false ]]; then
              [[ "$actual_assets" == "$expected_assets" ]]
              existing_dir="$(mktemp -d)"
              trap 'rm -rf "$existing_dir"' EXIT
              gh release download "$RELEASE_TAG" --repo voiceofhu/one-action --dir "$existing_dir"
              verify_assets "$existing_dir"
              exit 0
            fi
            while IFS= read -r asset; do
              case "$asset" in
                ''|SHA256SUMS|one-node-linux-amd64|one-node-linux-arm64) ;;
                *) printf 'Unexpected draft Release asset: %s\n' "$asset" >&2; exit 1 ;;
              esac
            done <<<"$actual_assets"
          else
            gh release create "$RELEASE_TAG" \
              --repo voiceofhu/one-action \
              --verify-tag \
              --draft \
              --title one-node \
              --notes "$notes" \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" \
            dist/SHA256SUMS dist/one-node-linux-amd64 dist/one-node-linux-arm64 \
            --repo voiceofhu/one-action \
            --clobber
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT
          gh release download "$RELEASE_TAG" --repo voiceofhu/one-action --dir "$readback_dir"
          verify_assets "$readback_dir"
          release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          jq -e --arg body "$notes" \
            '.body == $body and .isDraft == true and .isPrerelease == false' \
            <<<"$release_json" >/dev/null
          [[ "$actual_assets" == "$expected_assets" ]]

  publish-release:
    name: Publish verified GitHub Release
    needs:
      - prepare
      - publish-image
      - upload-release
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          RELEASE_TAG: one-node-v${{ needs.prepare.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          expected_assets=$'SHA256SUMS\none-node-linux-amd64\none-node-linux-arm64'
          notes="$(printf 'Node source: voiceofhu/one-node-node@%s\nUpstream: sing-box %s@%s\nDocker image: ghcr.io/voiceofhu/one-node:%s' \
            "$NODE_SHA" "$UPSTREAM_VERSION" "$UPSTREAM_COMMIT" "$VERSION")"
          gh release edit "$RELEASE_TAG" \
            --repo voiceofhu/one-action \
            --draft=false \
            --latest=false
          release_json="$(gh release view "$RELEASE_TAG" --repo voiceofhu/one-action \
            --json body,assets,isDraft,isPrerelease)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          jq -e --arg body "$notes" \
            '.body == $body and .isDraft == false and .isPrerelease == false' \
            <<<"$release_json" >/dev/null
          [[ "$actual_assets" == "$expected_assets" ]]
