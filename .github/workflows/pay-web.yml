name: One Pay Web

"on":
  workflow_dispatch:
    inputs:
      expected_action_sha: { required: true, type: string }
      confirmation: { required: true, type: string }
      web_repository: { required: true, type: string }
      web_ref: { required: true, type: string }
      version: { required: true, type: string }
      publish: { required: true, type: boolean }
      deploy: { required: true, type: boolean }

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/reusable-deploy-web.yml
    with:
      product: pay
      expected_action_sha: ${{ inputs.expected_action_sha }}
      confirmation: ${{ inputs.confirmation }}
      web_repository: ${{ inputs.web_repository }}
      web_ref: ${{ inputs.web_ref }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      deploy: ${{ inputs.deploy }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
