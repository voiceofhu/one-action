name: Build Windows debug app locally

'on':
  workflow_call:
    inputs:
      action_sha:
        required: true
        type: string
      app_repository:
        required: true
        type: string
      app_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Verify Windows x64 debug bundle
    runs-on: windows-2022
    steps:
      - name: Verify immutable inputs
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
          APP_SHA: ${{ inputs.app_sha }}
          WORKFLOW_ACTION_SHA: ${{ github.sha }}
          ACTION_REPOSITORY: ${{ github.repository }}
          APP_REPOSITORY: ${{ inputs.app_repository }}
        run: |
          set -Eeuo pipefail
          for entry in "action_sha:$ACTION_SHA" "app_sha:$APP_SHA"; do
            label="${entry%%:*}"
            sha="${entry#*:}"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$label must be an exact 40-character commit SHA" >&2
              exit 1
            fi
          done
          if [ "$ACTION_SHA" != "$WORKFLOW_ACTION_SHA" ]; then
            echo "Action workflow commit does not match the verified Action SHA." >&2
            exit 1
          fi
          [ "$ACTION_REPOSITORY" = voiceofhu/one-action ] || {
            echo "Action repository differs from the fixed App Debug trust root." >&2
            exit 1
          }
          [ "$APP_REPOSITORY" = voiceofhu/one-browser-app-next ] || {
            echo "App repository differs from the fixed App source trust root." >&2
            exit 1
          }

      - name: Checkout Action tooling at exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.action_sha }}
          path: action
          persist-credentials: false

      - name: Checkout App at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_sha }}
          path: app
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout heads and immutable source controls
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -Eeuo pipefail
          for entry in "action:$ACTION_SHA" "app:$APP_SHA"; do
            directory="${entry%%:*}"
            expected="${entry#*:}"
            actual="$(GIT_NO_REPLACE_OBJECTS=1 git -C "$directory" rev-parse --verify HEAD)"
            [ "$actual" = "$expected" ] || {
              echo "$directory checkout HEAD does not match its exact requested SHA." >&2
              exit 1
            }
          done
          for path in \
            app/package.json \
            app/pnpm-lock.yaml \
            app/rust-toolchain.toml \
            app/src-tauri/Cargo.toml \
            app/src-tauri/Cargo.lock \
            app/src-tauri/tauri.conf.json; do
            [ -f "$path" ] && [ ! -L "$path" ] || {
              echo "A required App build-control file is missing or symlinked." >&2
              exit 1
            }
            size="$(wc -c < "$path" | tr -d '[:space:]')"
            [[ "$size" =~ ^[0-9]+$ ]] && ((size > 0 && size <= 8388608)) || {
              echo "A required App build-control file has an invalid size." >&2
              exit 1
            }
          done
          grep -Eq '^channel = "1\.97\.1"$' app/rust-toolchain.toml || {
            echo "App Rust toolchain must remain exactly 1.97.1." >&2
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Verify fixed toolchain and source versions
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$(node --version)" = v24.0.0 ] || {
            echo "Node.js differs from the fixed 24.0.0 contract." >&2
            exit 1
          }
          [ "$(pnpm --version)" = 10.32.1 ] || {
            echo "pnpm differs from the fixed 10.32.1 contract." >&2
            exit 1
          }
          [ "$(rustc --version | awk '{print $2}')" = 1.97.1 ] || {
            echo "rustc differs from the fixed 1.97.1 contract." >&2
            exit 1
          }
          package_name="$(jq -er '.name' app/package.json)"
          package_version="$(jq -er '.version' app/package.json)"
          tauri_version="$(jq -er '.version' app/src-tauri/tauri.conf.json)"
          cargo_version="$(cargo metadata --manifest-path app/src-tauri/Cargo.toml --no-deps --locked --format-version 1 | jq -er '.packages | map(select(.name == "one-browser-app")) | if length == 1 then .[0].version else empty end')"
          [ "$package_name" = one-browser-app ] \
            && [ "$package_version" = "$tauri_version" ] \
            && [ "$package_version" = "$cargo_version" ] || {
            echo "App package, Tauri, and Cargo versions must match exactly." >&2
            exit 1
          }
          [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            && ((${#package_version} <= 32)) || {
            echo "Exact App source version is not canonical." >&2
            exit 1
          }
          printf 'APP_SOURCE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"

      - name: Verify Windows runner architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne 'x64') {
            throw 'Windows runner architecture does not match the App Debug contract.'
          }

      - name: Install frozen frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --check "**/*.{ts,tsx}"
          pnpm lint
          pnpm typecheck
          pnpm build
          test -f dist/index.html

      - name: Verify Rust
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows debug binary and NSIS installer
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src-tauri/tauri.conf.json
          pnpm exec tauri build --debug --bundles nsis --ci --no-sign

      - name: Require and collect debug artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly MAX_BINARY_BYTES=536870912
          readonly MAX_INSTALLER_BYTES=2147483648
          readonly MAX_PDB_BYTES=2147483648
          validate_artifact() {
            local path="$1"
            local maximum="$2"
            local label="$3"
            local size
            [ -f "$path" ] && [ ! -L "$path" ] || {
              echo "$label is missing, not regular, or symlinked." >&2
              exit 1
            }
            size="$(wc -c < "$path" | tr -d '[:space:]')"
            [[ "$size" =~ ^[0-9]+$ ]] && ((size > 0 && size <= maximum)) || {
              echo "$label is empty or exceeds its fixed size limit." >&2
              exit 1
            }
          }
          validate_name() {
            local name="$1"
            ((${#name} > 0 && ${#name} <= 180)) || {
              echo "Debug artifact name length is outside the fixed bound." >&2
              exit 1
            }
            case "$name" in
              [!A-Za-z0-9]*|*$'\n'*|*$'\r'*|*$'\t'*|*/*|*\\*)
                echo "Debug artifact name contains a forbidden path/control character." >&2
                exit 1
                ;;
            esac
          }
          binary="app/src-tauri/target/debug/one-browser-app.exe"
          installer_dir="app/src-tauri/target/debug/bundle/nsis"
          pdb="app/src-tauri/target/debug/one-browser-app.pdb"
          for directory in \
            app/src-tauri/target \
            app/src-tauri/target/debug \
            app/src-tauri/target/debug/bundle \
            "$installer_dir"; do
            [ -d "$directory" ] && [ ! -L "$directory" ] || {
              echo "A Debug App output directory is missing or symlinked." >&2
              exit 1
            }
          done
          validate_artifact "$binary" "$MAX_BINARY_BYTES" "Debug App binary"
          validate_artifact "$pdb" "$MAX_PDB_BYTES" "Debug App PDB"
          mkdir provenance || {
            echo "Runner-local debug provenance destination must be create-new." >&2
            exit 1
          }
          mkdir -p provenance/artifacts/binary provenance/artifacts/installer provenance/artifacts/pdb
          cp "$binary" provenance/artifacts/binary/
          cp "$pdb" provenance/artifacts/pdb/
          installer_count=0
          while IFS= read -r -d '' installer; do
            installer_count=$((installer_count + 1))
            ((installer_count <= 1)) || {
              echo "Expected exactly one Debug NSIS installer." >&2
              exit 1
            }
            validate_name "$(basename "$installer")"
            validate_artifact "$installer" "$MAX_INSTALLER_BYTES" "Debug NSIS installer"
            cp "$installer" provenance/artifacts/installer/
          done < <(find "$installer_dir" -maxdepth 1 -type f -name '*.exe' -print0)
          ((installer_count == 1)) || {
            echo "Expected exactly one Debug NSIS installer." >&2
            exit 1
          }

      - name: Verify source identity after build
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -Eeuo pipefail
          for entry in "action:$ACTION_SHA" "app:$APP_SHA"; do
            directory="${entry%%:*}"
            expected="${entry#*:}"
            actual="$(GIT_NO_REPLACE_OBJECTS=1 git -C "$directory" rev-parse --verify HEAD)"
            [ "$actual" = "$expected" ] || {
              echo "$directory checkout HEAD drifted during the debug build." >&2
              exit 1
            }
            GIT_NO_REPLACE_OBJECTS=1 git -C "$directory" diff --quiet --no-ext-diff --ignore-submodules --
            GIT_NO_REPLACE_OBJECTS=1 git -C "$directory" diff --cached --quiet --no-ext-diff --ignore-submodules --
          done

      - name: Generate runner-local debug provenance
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
          APP_REPOSITORY: ${{ inputs.app_repository }}
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -Eeuo pipefail
          checksum_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          (
            cd provenance
            find artifacts -type f -print |
              LC_ALL=C sort |
              while IFS= read -r file; do
                case "$file" in
                  artifacts/binary/*|artifacts/installer/*|artifacts/pdb/*) ;;
                  *) echo "Unexpected debug provenance artifact path." >&2; exit 1 ;;
                esac
                printf '%s  %s\n' "$(checksum_file "$file")" "$file"
              done
          ) > provenance/artifacts.sha256
          jq -Rn \
            '[inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<path>.*)$")]' \
            < provenance/artifacts.sha256 > provenance/artifacts.json
          jq -e '
            length == 3 and
            all(.[];
              (.sha256 | test("^[0-9a-f]{64}$")) and
              (.path | test("^artifacts/(binary|installer|pdb)/[A-Za-z0-9][A-Za-z0-9._+() -]{0,179}$")) and
              (.path | contains("..") | not)
            )
          ' provenance/artifacts.json >/dev/null

          tar -czf provenance/app-debug-artifacts.tar.gz -C provenance artifacts
          bash action/scripts/release/write-checksums.sh \
            provenance/SHA256SUMS provenance/app-debug-artifacts.tar.gz
          jq -n \
            --arg action_sha "$ACTION_SHA" \
            --arg app_repository "$APP_REPOSITORY" \
            --arg app_sha "$APP_SHA" \
            --arg version "$APP_SOURCE_VERSION" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile artifacts provenance/artifacts.json \
            '{
              schema_version: 1,
              workflow: "app-debug",
              action_sha: $action_sha,
              app: { repository: $app_repository, sha: $app_sha },
              platform: "windows-x64",
              profile: "debug",
              version: $version,
              generated_at: $generated_at,
              artifacts: $artifacts[0],
              bundle: "app-debug-artifacts.tar.gz",
              checksums: "SHA256SUMS",
              uploaded: false,
              published: false
            }' > provenance/manifest.json
          jq -e '
            .app.repository == "voiceofhu/one-browser-app-next" and
            (.app.sha | test("^[0-9a-f]{40}$")) and
            (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) and
            ([.artifacts[].path | select(endswith("/one-browser-app.pdb"))] | length == 1) and
            .uploaded == false and .published == false
          ' provenance/manifest.json >/dev/null
          test -s provenance/SHA256SUMS

      - name: Record non-uploading debug build
        shell: bash
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -Eeuo pipefail
          artifact_count="$(find provenance/artifacts -type f | wc -l | tr -d ' ')"
          {
            echo "## Windows App debug build verification"
            echo
            echo "- App SHA: \`$APP_SHA\`"
            echo "- Frontend: frozen install + format/lint/typecheck/build"
            echo "- Rust: fmt/check/clippy/test (locked)"
            echo "- Required outputs: debug binary + NSIS installer + PDB"
            echo "- Artifact count: \`$artifact_count\`"
            echo "- Provenance and SHA256SUMS: generated in the runner"
            echo "- Upload/sign/release/deploy: not run"
          } >> "$GITHUB_STEP_SUMMARY"
