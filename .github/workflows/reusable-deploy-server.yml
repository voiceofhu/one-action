name: Reusable Deploy Server

# Publishes and deploys one products.json Server with its bundled Web. Product
# entry workflows (<product>-server.yml) only forward their dispatch inputs.
'on':
  workflow_call:
    inputs:
      product: { required: true, type: string }
      expected_action_sha: { required: true, type: string }
      confirmation: { required: true, type: string }
      backend_repository: { required: true, type: string }
      backend_ref: { required: true, type: string }
      web_repository: { required: true, type: string }
      web_ref: { required: true, type: string }
      version: { required: true, type: string }
      publish: { required: true, type: boolean }
    secrets:
      GH_TOKEN: { required: true }
      DEPLOY_HOST: { required: false }
      DEPLOY_PORT: { required: false }
      DEPLOY_USER: { required: false }
      DEPLOY_SSH_KEY: { required: false }
      DEPLOY_KNOWN_HOSTS: { required: false }

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve exact release sources
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      web_sha: ${{ steps.release.outputs.web_sha }}
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
      title: ${{ steps.product.outputs.title }}
      name: ${{ steps.product.outputs.name }}
      backend_repository: ${{ steps.product.outputs.backend_repository }}
      public_url: ${{ steps.product.outputs.public_url }}
      remote_dir: ${{ steps.product.outputs.remote_dir }}
    steps:
      - name: Checkout exact product manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            products.json
            scripts/lib
          sparse-checkout-cone-mode: false

      - name: Load product
        id: product
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash action/scripts/lib/product.sh "$PRODUCT" >>"$GITHUB_OUTPUT"

      - name: Validate dispatched release sources
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRODUCT: ${{ inputs.product }}
          PRODUCT_NAME: ${{ steps.product.outputs.name }}
          PRODUCT_TITLE: ${{ steps.product.outputs.title }}
          PRODUCT_BACKEND_REPOSITORY: ${{ steps.product.outputs.backend_repository }}
          PRODUCT_WEB_REPOSITORY: ${{ steps.product.outputs.web_repository }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_REPOSITORY: ${{ inputs.backend_repository }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          WEB_REPOSITORY: ${{ inputs.web_repository }}
          WEB_SHA: ${{ inputs.web_ref }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$CALLER_WORKFLOW" == "voiceofhu/one-action/.github/workflows/$PRODUCT-server.yml@"* \
            && "$ACTION_SHA" == "$EXPECTED_ACTION_SHA" \
            && "$CONFIRMATION" == "enable:$PRODUCT_NAME:$ACTION_SHA" \
            && "$BACKEND_REPOSITORY" == "$PRODUCT_BACKEND_REPOSITORY" \
            && "$WEB_REPOSITORY" == "$PRODUCT_WEB_REPOSITORY" \
            && "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ \
            && "$WEB_SHA" =~ ^[0-9a-f]{40}$ \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && "$PUBLISH" == true \
            && -n "$GH_TOKEN" ]] || {
            echo "Invalid $PRODUCT_TITLE dispatch inputs or Action trust root." >&2
            exit 1
          }
          backend_commit_file="$RUNNER_TEMP/$PRODUCT_NAME-backend-commit.json"
          web_commit_file="$RUNNER_TEMP/$PRODUCT_NAME-web-commit.json"
          gh api "repos/$BACKEND_REPOSITORY/commits/$BACKEND_SHA" >"$backend_commit_file" &
          backend_pid=$!
          gh api "repos/$WEB_REPOSITORY/commits/$WEB_SHA" >"$web_commit_file" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
          backend_sha="$(jq -er .sha "$backend_commit_file")"
          web_sha="$(jq -er .sha "$web_commit_file")"
          created_at="$(jq -er '.commit.committer.date' "$web_commit_file")"
          [[ "$backend_sha" == "$BACKEND_SHA" && "$web_sha" == "$WEB_SHA" ]] || {
            echo "$PRODUCT_TITLE dispatch source SHAs could not be verified." >&2
            exit 1
          }
          [[ "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          {
            printf 'backend_sha=%s\n' "$backend_sha"
            printf 'web_sha=%s\n' "$web_sha"
            printf 'version=%s\n' "$VERSION"
            printf 'created_at=%s\n' "$created_at"
          } >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-server-image.yml
    with:
      workflow_name: ${{ needs.prepare.outputs.name }}
      action_sha: ${{ github.sha }}
      backend_sha: ${{ needs.prepare.outputs.backend_sha }}
      web_sha: ${{ needs.prepare.outputs.web_sha }}
      version: ${{ needs.prepare.outputs.version }}
      created_at: ${{ needs.prepare.outputs.created_at }}
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Deploy ${{ needs.prepare.outputs.title }} image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: one-${{ inputs.product }}-prod
      url: ${{ vars.DEPLOY_URL || needs.prepare.outputs.public_url }}
    concurrency:
      group: one-${{ inputs.product }}-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Backend deployment file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.prepare.outputs.backend_repository }}
          ref: ${{ needs.prepare.outputs.backend_sha }}
          path: backend
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-${{ inputs.product }}-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh

      - name: Log server in to GitHub Container Registry
        id: registry_login
        shell: bash
        env:
          SSH_HOST: one-${{ inputs.product }}-deploy
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: exec bash action/scripts/deploy/registry-auth.sh

      - name: Deploy versioned image
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          SSH_HOST: one-${{ inputs.product }}-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || needs.prepare.outputs.remote_dir }}
          DOCKER_IMAGE: ${{ needs.publish.outputs.image_ref }}
          COMPOSE_FILE: backend/deploy/docker/docker-compose.yml
          PUBLIC_URL: ${{ vars.DEPLOY_URL || needs.prepare.outputs.public_url }}
        run: exec bash action/scripts/deploy/deploy-server.sh

      - name: Log server out of GitHub Container Registry
        if: ${{ always() && steps.registry_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: one-${{ inputs.product }}-deploy
          REGISTRY_ACTION: logout
        run: exec bash action/scripts/deploy/registry-auth.sh
