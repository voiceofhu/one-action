name: Reusable Deploy Web Image

# Publishes one products.json Web whose web_runtime is next as its own image and
# replaces only the Compose `web` service; the Server container is not changed.
# Product entry workflows (<product>-web.yml) run on a deploy/<product>-web/<version>
# tag whose message pins the exact Web commit.
'on':
  workflow_call:
    inputs:
      product: { required: true, type: string }
    secrets:
      GH_TOKEN: { required: true }
      DEPLOY_HOST: { required: false }
      DEPLOY_PORT: { required: false }
      DEPLOY_USER: { required: false }
      DEPLOY_SSH_KEY: { required: false }
      DEPLOY_KNOWN_HOSTS: { required: false }

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve exact Web source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      web_sha: ${{ steps.release.outputs.web_sha }}
      version: ${{ steps.release.outputs.version }}
      created_at: ${{ steps.release.outputs.created_at }}
      title: ${{ steps.product.outputs.title }}
      name: ${{ steps.product.outputs.name }}
      web_repository: ${{ steps.product.outputs.web_repository }}
      web_image: ${{ steps.product.outputs.web_image }}
      web_dockerfile: ${{ steps.product.outputs.web_dockerfile }}
      pnpm_version: ${{ steps.product.outputs.pnpm_version }}
      public_url: ${{ steps.product.outputs.public_url }}
      remote_dir: ${{ steps.product.outputs.remote_dir }}
    steps:
      - name: Checkout exact product manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            products.json
            scripts/github
            scripts/lib
          sparse-checkout-cone-mode: false

      - name: Read deploy tag
        id: trigger
        shell: bash
        working-directory: action
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash scripts/github/read-trigger.sh "$PRODUCT-web" web_ref >>"$GITHUB_OUTPUT"

      - name: Load product
        id: product
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash action/scripts/lib/product.sh "$PRODUCT" >>"$GITHUB_OUTPUT"

      - name: Validate release source
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRODUCT: ${{ inputs.product }}
          PRODUCT_TITLE: ${{ steps.product.outputs.title }}
          WEB_RUNTIME: ${{ steps.product.outputs.web_runtime }}
          WEB_REPOSITORY: ${{ steps.product.outputs.web_repository }}
          WEB_SHA: ${{ steps.trigger.outputs.web_ref }}
          VERSION: ${{ steps.trigger.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$CALLER_WORKFLOW" == "voiceofhu/one-action/.github/workflows/$PRODUCT-web.yml@"* \
            && "$WEB_RUNTIME" == next \
            && "$WEB_SHA" =~ ^[0-9a-f]{40}$ \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && -n "$GH_TOKEN" ]] || {
            echo "Invalid $PRODUCT_TITLE Web deploy tag, runtime, or Action trust root." >&2
            exit 1
          }
          commit_file="$RUNNER_TEMP/web-commit.json"
          gh api "repos/$WEB_REPOSITORY/commits/$WEB_SHA" >"$commit_file"
          [[ "$(jq -er .sha "$commit_file")" == "$WEB_SHA" ]] || {
            echo "$PRODUCT_TITLE Web tag source SHA could not be verified." >&2
            exit 1
          }
          created_at="$(jq -er '.commit.committer.date' "$commit_file")"
          [[ "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          {
            printf 'web_sha=%s\n' "$WEB_SHA"
            printf 'version=%s\n' "$VERSION"
            printf 'created_at=%s\n' "$created_at"
          } >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-server-image.yml
    with:
      workflow_name: ${{ needs.prepare.outputs.name }}-web
      backend_repository: ${{ needs.prepare.outputs.web_repository }}
      web_repository: ${{ needs.prepare.outputs.web_repository }}
      image: ${{ needs.prepare.outputs.web_image }}
      dockerfile: ${{ needs.prepare.outputs.web_dockerfile }}
      pnpm_version: ${{ needs.prepare.outputs.pnpm_version }}
      action_sha: ${{ github.sha }}
      backend_sha: ${{ needs.prepare.outputs.web_sha }}
      web_sha: ${{ needs.prepare.outputs.web_sha }}
      version: ${{ needs.prepare.outputs.version }}
      created_at: ${{ needs.prepare.outputs.created_at }}
      stage_web: false
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Deploy ${{ needs.prepare.outputs.title }} Web image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: one-${{ inputs.product }}-prod
      url: ${{ vars.DEPLOY_URL || needs.prepare.outputs.public_url }}
    concurrency:
      group: one-${{ inputs.product }}-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-${{ inputs.product }}-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh

      - name: Log server in to GitHub Container Registry
        id: registry_login
        shell: bash
        env:
          SSH_HOST: one-${{ inputs.product }}-deploy
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: exec bash action/scripts/deploy/registry-auth.sh

      - name: Deploy Web image without replacing Server
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          SSH_HOST: one-${{ inputs.product }}-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || needs.prepare.outputs.remote_dir }}
          WEB_DOCKER_IMAGE: ${{ needs.publish.outputs.image_ref }}
          PUBLIC_URL: ${{ vars.DEPLOY_URL || needs.prepare.outputs.public_url }}
        run: exec bash action/scripts/deploy/deploy-web-image.sh

      - name: Log server out of GitHub Container Registry
        if: ${{ always() && steps.registry_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: one-${{ inputs.product }}-deploy
          REGISTRY_ACTION: logout
        run: exec bash action/scripts/deploy/registry-auth.sh
