name: Reusable Deploy Web

# Builds one products.json Web and switches the server's static release without
# restarting the Server. Product entry workflows (<product>-web.yml) run on a
# deploy/<product>-web/<version> tag whose message pins the exact Web commit.
'on':
  workflow_call:
    inputs:
      product: { required: true, type: string }
    secrets:
      GH_TOKEN: { required: true }
      DEPLOY_HOST: { required: false }
      DEPLOY_PORT: { required: false }
      DEPLOY_USER: { required: false }
      DEPLOY_SSH_KEY: { required: false }
      DEPLOY_KNOWN_HOSTS: { required: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      public_url: ${{ steps.product.outputs.public_url }}
      remote_dir: ${{ steps.product.outputs.remote_dir }}
      web_sha: ${{ steps.trigger.outputs.web_ref }}
    steps:
      - name: Checkout exact product manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            products.json
            scripts/github
            scripts/lib
          sparse-checkout-cone-mode: false
      - name: Read deploy tag
        id: trigger
        shell: bash
        working-directory: action
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash scripts/github/read-trigger.sh "$PRODUCT-web" web_ref >>"$GITHUB_OUTPUT"
      - name: Load product
        id: product
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash action/scripts/lib/product.sh "$PRODUCT" >>"$GITHUB_OUTPUT"
      - name: Validate caller
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          PRODUCT: ${{ inputs.product }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$CALLER_WORKFLOW" == "voiceofhu/one-action/.github/workflows/$PRODUCT-web.yml@"* ]]
      - name: Checkout exact Web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.product.outputs.web_repository }}
          ref: ${{ steps.trigger.outputs.web_ref }}
          path: web
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.product.outputs.pnpm_version }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build production Web
        shell: bash
        env:
          WEB_SHA: ${{ steps.trigger.outputs.web_ref }}
          VITE_APP_VERSION: ${{ steps.trigger.outputs.version }}
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          printf '%s\n' "$WEB_SHA" > web/dist/one-web-revision.txt
          tar -czf web.tar.gz -C web/dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.product }}-web
          path: web.tar.gz
          if-no-files-found: error
          retention-days: 2
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: one-${{ inputs.product }}-prod
      url: ${{ vars.DEPLOY_URL || needs.build.outputs.public_url }}
    concurrency:
      group: one-${{ inputs.product }}-prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.product }}-web
          path: dist
      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-${{ inputs.product }}-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh
      - name: Deploy Web without replacing Server
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          SSH_HOST: one-${{ inputs.product }}-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || needs.build.outputs.remote_dir }}
          WEB_ARCHIVE: dist/web.tar.gz
          WEB_SHA: ${{ needs.build.outputs.web_sha }}
          PUBLIC_URL: ${{ vars.DEPLOY_URL || needs.build.outputs.public_url }}
        run: exec bash action/scripts/deploy/deploy-web.sh
