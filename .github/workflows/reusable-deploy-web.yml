name: Reusable Deploy Web

# Builds one products.json Web and switches the server's static release without
# restarting the Server. Product entry workflows (<product>-web.yml) only
# forward their dispatch inputs.
'on':
  workflow_call:
    inputs:
      product: { required: true, type: string }
      expected_action_sha: { required: true, type: string }
      confirmation: { required: true, type: string }
      web_repository: { required: true, type: string }
      web_ref: { required: true, type: string }
      version: { required: true, type: string }
      publish: { required: true, type: boolean }
      deploy: { required: true, type: boolean }
    secrets:
      GH_TOKEN: { required: true }
      DEPLOY_HOST: { required: false }
      DEPLOY_PORT: { required: false }
      DEPLOY_USER: { required: false }
      DEPLOY_SSH_KEY: { required: false }
      DEPLOY_KNOWN_HOSTS: { required: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      public_url: ${{ steps.product.outputs.public_url }}
      remote_dir: ${{ steps.product.outputs.remote_dir }}
    steps:
      - name: Checkout exact product manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            products.json
            scripts/lib
          sparse-checkout-cone-mode: false
      - name: Load product
        id: product
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: bash action/scripts/lib/product.sh "$PRODUCT" >>"$GITHUB_OUTPUT"
      - name: Validate dispatch
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SHA: ${{ github.sha }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          PRODUCT: ${{ inputs.product }}
          PRODUCT_WEB_REPOSITORY: ${{ steps.product.outputs.web_repository }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WEB_REPOSITORY: ${{ inputs.web_repository }}
          WEB_SHA: ${{ inputs.web_ref }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$CALLER_WORKFLOW" == "voiceofhu/one-action/.github/workflows/$PRODUCT-web.yml@"* \
            && "$ACTION_SHA" == "$EXPECTED_ACTION_SHA" \
            && "$CONFIRMATION" == "enable:$PRODUCT-web:$ACTION_SHA" \
            && "$WEB_REPOSITORY" == "$PRODUCT_WEB_REPOSITORY" \
            && "$WEB_SHA" =~ ^[0-9a-f]{40}$ \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && "$PUBLISH" == true && "$DEPLOY" == true ]]
      - name: Checkout exact Web source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.product.outputs.web_repository }}
          ref: ${{ inputs.web_ref }}
          path: web
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build production Web
        shell: bash
        env:
          WEB_SHA: ${{ inputs.web_ref }}
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          printf '%s\n' "$WEB_SHA" > web/dist/one-web-revision.txt
          tar -czf web.tar.gz -C web/dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.product }}-web
          path: web.tar.gz
          if-no-files-found: error
          retention-days: 2
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: one-${{ inputs.product }}-prod
      url: ${{ vars.DEPLOY_URL || needs.build.outputs.public_url }}
    concurrency:
      group: one-${{ inputs.product }}-prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: action
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.product }}-web
          path: dist
      - name: Configure SSH
        shell: bash
        env:
          SSH_ALIAS: one-${{ inputs.product }}-deploy
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh
      - name: Deploy Web without replacing Server
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          SSH_HOST: one-${{ inputs.product }}-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || needs.build.outputs.remote_dir }}
          WEB_ARCHIVE: dist/web.tar.gz
          WEB_SHA: ${{ inputs.web_ref }}
          PUBLIC_URL: ${{ vars.DEPLOY_URL || needs.build.outputs.public_url }}
        run: exec bash action/scripts/deploy/deploy-web.sh
