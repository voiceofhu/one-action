name: Reusable Publish Tauri App

# Builds one apps.json desktop client on Linux, Windows and macOS (or the App's
# `platforms`) and publishes an immutable one-<key>-app-v<version> Release on One
# Action. Entry workflows (<key>-app.yml) run on a deploy/<key>-app/<version> tag
# whose message pins the exact App commit (and web_ref for an App's bundled web,
# backend_ref for the server packages a sidecar builds against). An App with
# `updater_config` also gets Tauri updater bundles, their minisign signatures
# (TAURI_SIGNING_PRIVATE_KEY, passed only by that App's entry workflow) and a
# latest.json on the Release; other Apps build exactly as before.
'on':
  workflow_call:
    inputs:
      app: {required: true, type: string}
    secrets:
      GH_TOKEN: {required: true}
      TAURI_SIGNING_PRIVATE_KEY: {required: false}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: {required: false}

permissions:
  contents: read

env:
  CI: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve exact App source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      app_sha: ${{ steps.release.outputs.app_sha }}
      web_sha: ${{ steps.release.outputs.web_sha }}
      backend_sha: ${{ steps.release.outputs.backend_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.trigger.outputs.version }}
      title: ${{ steps.app.outputs.title }}
      repository: ${{ steps.app.outputs.repository }}
      pnpm_version: ${{ steps.app.outputs.pnpm_version }}
      macos_config: ${{ steps.app.outputs.macos_config }}
      web_repository: ${{ steps.app.outputs.web_repository }}
      backend_repository: ${{ steps.app.outputs.backend_repository }}
      go_version_file: ${{ steps.app.outputs.go_version_file }}
      updater_config: ${{ steps.app.outputs.updater_config }}
      release_prefix: ${{ steps.app.outputs.release_prefix }}
      pnpm_native: ${{ steps.pnpm.outputs.native }}
    steps:
      - name: Checkout exact app manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            apps.json
            scripts/github
            scripts/lib
          sparse-checkout-cone-mode: false

      - name: Load app
        id: app
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: bash action/scripts/lib/app.sh "$APP" >>"$GITHUB_OUTPUT"

      # pnpm 11+ ships native executables, installed by pnpm/setup; the Node-based
      # self-installer of pnpm/action-setup fails for them on some runners
      # (pnpm/action-setup#251), and pnpm/setup takes only pnpm 11+.
      - name: Choose pnpm installer
        id: pnpm
        shell: bash
        env:
          PNPM_VERSION: ${{ steps.app.outputs.pnpm_version }}
        run: |
          set -Eeuo pipefail
          native=false
          (( ${PNPM_VERSION%%.*} < 11 )) || native=true
          printf 'native=%s\n' "$native" >>"$GITHUB_OUTPUT"

      - name: Read deploy tag
        id: trigger
        shell: bash
        working-directory: action
        env:
          APP: ${{ inputs.app }}
          WEB_REPOSITORY: ${{ steps.app.outputs.web_repository }}
          BACKEND_REPOSITORY: ${{ steps.app.outputs.backend_repository }}
        run: |
          set -Eeuo pipefail
          pins=(app_ref)
          [[ -z "$WEB_REPOSITORY" ]] || pins+=(web_ref)
          [[ -z "$BACKEND_REPOSITORY" ]] || pins+=(backend_ref)
          bash scripts/github/read-trigger.sh "$APP-app" "${pins[@]}" >>"$GITHUB_OUTPUT"

      - name: Plan platform builds
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ steps.app.outputs.platforms }}
          RUNNERS: ${{ steps.app.outputs.runners }}
          UPDATER_CONFIG: ${{ steps.app.outputs.updater_config }}
        run: |
          set -Eeuo pipefail
          # Updater bundles: macOS replaces the .app from a .app.tar.gz, which
          # Tauri makes only when the app bundle is a requested target.
          matrix="$(jq -cn --argjson wanted "$PLATFORMS" --argjson runners "$RUNNERS" \
            --arg updater "$UPDATER_CONFIG" '
            [
              {name: "linux-amd64", runner: "ubuntu-24.04", rust_target: "", bundles: "appimage,deb",
               assets: "app/src-tauri/target/release/bundle/appimage/*.AppImage\napp/src-tauri/target/release/bundle/deb/*.deb",
               updater_assets: "app/src-tauri/target/release/bundle/appimage/*.AppImage.sig"},
              {name: "windows-amd64", runner: "windows-latest", rust_target: "", bundles: "nsis",
               assets: "app/src-tauri/target/release/bundle/nsis/*.exe",
               updater_assets: "app/src-tauri/target/release/bundle/nsis/*.exe.sig"},
              {name: "macos-arm64", runner: "macos-15", rust_target: "aarch64-apple-darwin", bundles: "dmg",
               assets: "app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg",
               updater_bundles: "app,dmg",
               updater_assets: "app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz\napp/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"},
              {name: "macos-amd64", runner: "macos-15-intel", rust_target: "x86_64-apple-darwin", bundles: "dmg",
               assets: "app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg",
               updater_bundles: "app,dmg",
               updater_assets: "app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz\napp/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"}
            ]
            | if $updater == "" then .
              else map(.bundles = (.updater_bundles // .bundles) | .assets += "\n" + .updater_assets) end
            | map(del(.updater_bundles, .updater_assets)) as $all
            | ($all | map(.name)) as $known
            | if ($runners | keys) - $known == [] then .
              else error("unknown platform in runners \($runners | keys)") end
            | ($wanted // $known) as $names
            | $all
            | map(select(.name as $name | $names | index($name)) | .runner = ($runners[.name] // .runner))
            | if length == ($names | length) then {include: .}
              else error("unknown platform in \($names)") end
          ')"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

      - name: Validate release source
        id: release
        shell: bash
        env:
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ${{ github.sha }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          APP_KEY: ${{ inputs.app }}
          APP_TITLE: ${{ steps.app.outputs.title }}
          APP_REPOSITORY: ${{ steps.app.outputs.repository }}
          RELEASE_PREFIX: ${{ steps.app.outputs.release_prefix }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APP_SHA: ${{ steps.trigger.outputs.app_ref }}
          WEB_REPOSITORY: ${{ steps.app.outputs.web_repository }}
          WEB_SHA: ${{ steps.trigger.outputs.web_ref }}
          BACKEND_REPOSITORY: ${{ steps.app.outputs.backend_repository }}
          BACKEND_SHA: ${{ steps.trigger.outputs.backend_ref }}
          VERSION: ${{ steps.trigger.outputs.version }}
          UPDATER_CONFIG: ${{ steps.app.outputs.updater_config }}
          UPDATER_KEY_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -Eeuo pipefail
          [[ -z "$UPDATER_CONFIG" || "$UPDATER_KEY_SET" == true ]] || {
            echo "$APP_TITLE builds updater artifacts: set the TAURI_SIGNING_PRIVATE_KEY secret." >&2
            exit 1
          }
          [[ "$ACTION_REPOSITORY" == voiceofhu/one-action \
            && "$ACTION_SERVER_URL" == https://github.com \
            && "$CALLER_WORKFLOW" == "voiceofhu/one-action/.github/workflows/$APP_KEY-app.yml@"* \
            && "$ACTION_SHA" =~ ^[0-9a-f]{40}$ \
            && "$APP_SHA" =~ ^[0-9a-f]{40}$ \
            && ( -z "$WEB_REPOSITORY" || "$WEB_SHA" =~ ^[0-9a-f]{40}$ ) \
            && ( -z "$BACKEND_REPOSITORY" || "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ) \
            && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && -n "$GH_TOKEN" ]] || {
            echo "Invalid $APP_TITLE deploy tag or Action trust root." >&2
            exit 1
          }
          release_tag="$RELEASE_PREFIX-v$VERSION"
          release_file="$RUNNER_TEMP/$RELEASE_PREFIX-existing-release.json"
          if gh api "repos/$ACTION_REPOSITORY/releases/tags/$release_tag" >"$release_file"; then
            echo "Release $release_tag already exists; choose a new VERSION." >&2
            exit 1
          elif ! jq -e '.status == "404" or .status == 404' "$release_file" >/dev/null; then
            echo 'Unable to verify App release availability; refusing to build.' >&2
            exit 1
          fi
          commit_file="$RUNNER_TEMP/$RELEASE_PREFIX-commit.json"
          gh api "repos/$APP_REPOSITORY/commits/$APP_SHA" >"$commit_file"
          [[ "$(jq -er .sha "$commit_file")" == "$APP_SHA" ]]
          if [[ -n "$WEB_REPOSITORY" ]]; then
            gh api "repos/$WEB_REPOSITORY/commits/$WEB_SHA" >"$commit_file"
            [[ "$(jq -er .sha "$commit_file")" == "$WEB_SHA" ]]
            printf 'web_sha=%s\n' "$WEB_SHA" >>"$GITHUB_OUTPUT"
          fi
          if [[ -n "$BACKEND_REPOSITORY" ]]; then
            gh api "repos/$BACKEND_REPOSITORY/commits/$BACKEND_SHA" >"$commit_file"
            [[ "$(jq -er .sha "$commit_file")" == "$BACKEND_SHA" ]]
            printf 'backend_sha=%s\n' "$BACKEND_SHA" >>"$GITHUB_OUTPUT"
          fi
          printf 'app_sha=%s\n' "$APP_SHA" >>"$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout exact App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.app_sha }}
          path: app
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      # The App's build reads its bundled web from ../web.
      - name: Checkout exact Web source
        if: needs.prepare.outputs.web_repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.web_repository }}
          ref: ${{ needs.prepare.outputs.web_sha }}
          path: web
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      # A sidecar's go.mod replaces shared server packages with ../backend.
      - name: Checkout exact Backend source
        if: needs.prepare.outputs.backend_repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.backend_repository }}
          ref: ${{ needs.prepare.outputs.backend_sha }}
          path: backend
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        if: needs.prepare.outputs.pnpm_native != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.prepare.outputs.pnpm_version }}
          run_install: false

      - name: Set up native pnpm
        if: needs.prepare.outputs.pnpm_native == 'true' && (runner.os != 'macOS' || runner.arch != 'X64')
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: ${{ needs.prepare.outputs.pnpm_version }}

      # pnpm 11 ships no working Intel macOS binary (pnpm/pnpm#11423); on an
      # Intel Mac runner npm installs its JavaScript build on a Node.js set up
      # first. The version is the exact pin from apps.json and is checked after
      # installing.
      - name: Set up Node.js for npm-installed pnpm
        if: needs.prepare.outputs.pnpm_native == 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm from npm
        if: needs.prepare.outputs.pnpm_native == 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        env:
          PNPM_VERSION: ${{ needs.prepare.outputs.pnpm_version }}
        run: | # zizmor: ignore[adhoc-packages]
          set -Eeuo pipefail
          npm install --global "pnpm@$PNPM_VERSION"
          [[ "$(pnpm --version)" == "$PNPM_VERSION" ]]

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Set up source-declared Go toolchain
        if: needs.prepare.outputs.go_version_file != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/${{ needs.prepare.outputs.go_version_file }}
          cache: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        shell: bash
        env:
          WEB_REPOSITORY: ${{ needs.prepare.outputs.web_repository }}
        run: |
          set -Eeuo pipefail
          pnpm --dir app install --frozen-lockfile
          [[ -z "$WEB_REPOSITORY" ]] || pnpm --dir web install --frozen-lockfile

      - name: Set App release version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          (cd app && node scripts/update-version.mjs "$VERSION")
          actual="$(node -e 'const p=require("./app/package.json");process.stdout.write(p.version||"")')"
          [[ "$actual" == "$VERSION" ]]

      - name: Build desktop bundle
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          CONFIG: ${{ startsWith(matrix.name, 'macos-') && needs.prepare.outputs.macos_config || '' }}
          RUST_TARGET: ${{ matrix.rust_target }}
          UPDATER_CONFIG: ${{ needs.prepare.outputs.updater_config }}
          # Only an App with updater_config gets the signing key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.updater_config != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.updater_config != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -Eeuo pipefail
          args=(--bundles "$BUNDLES" --ci)
          [[ -z "$RUST_TARGET" ]] || args+=(--target "$RUST_TARGET")
          [[ -z "$CONFIG" ]] || args+=(--config "$CONFIG")
          [[ -z "$UPDATER_CONFIG" ]] || args+=(--config "$UPDATER_CONFIG")
          pnpm --dir app tauri:build "${args[@]}"

      - name: Upload verified bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.release_prefix }}-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish immutable App release
    permissions:
      contents: write
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.prepare.outputs.release_prefix }}-*
          path: dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_PREFIX: ${{ needs.prepare.outputs.release_prefix }}
          APP_TITLE: ${{ needs.prepare.outputs.title }}
          APP_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          APP_SHA: ${{ needs.prepare.outputs.app_sha }}
          WEB_REPOSITORY: ${{ needs.prepare.outputs.web_repository }}
          WEB_SHA: ${{ needs.prepare.outputs.web_sha }}
          BACKEND_REPOSITORY: ${{ needs.prepare.outputs.backend_repository }}
          BACKEND_SHA: ${{ needs.prepare.outputs.backend_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATER_CONFIG: ${{ needs.prepare.outputs.updater_config }}
        run: |
          set -Eeuo pipefail
          mkdir release-assets
          # GitHub stores an asset name with other characters (the space in
          # "One Node_…") as "."; name the files that way first so SHA256SUMS
          # lists the names a download actually has.
          while IFS= read -r -d '' asset; do
            artifact="${asset#dist/}"
            artifact="${artifact%%/*}"
            name="$(sed -E 's/[^A-Za-z0-9._-]+/./g' <<<"$artifact-$(basename "$asset")")"
            target="release-assets/$name"
            [[ ! -e "$target" ]]
            cp "$asset" "$target"
          done < <(find dist -type f -print0 | sort -z)
          if [[ -n "$UPDATER_CONFIG" ]]; then
            # Tauri updater manifest (static format): every platform's updater
            # bundle with the content of its minisign .sig, by Tauri target.
            manifest="$(jq -n --arg version "$VERSION" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $version, notes: "", pub_date: $date, platforms: {}}')"
            for dir in dist/*/; do
              platform="${dir#"dist/$RELEASE_PREFIX-"}"
              platform="${platform%/}"
              case "$platform" in
                windows-amd64) target=windows-x86_64 ;;
                macos-arm64) target=darwin-aarch64 ;;
                macos-amd64) target=darwin-x86_64 ;;
                linux-amd64) target=linux-x86_64 ;;
                *) echo "No updater target for $platform." >&2; exit 1 ;;
              esac
              sigs=(release-assets/"$RELEASE_PREFIX-$platform-"*.sig)
              [[ ${#sigs[@]} -eq 1 && -f "${sigs[0]}" && -f "${sigs[0]%.sig}" ]] || {
                echo "Expected one updater bundle and signature for $platform." >&2
                exit 1
              }
              bundle="${sigs[0]%.sig}"
              manifest="$(jq --arg target "$target" \
                --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/${bundle#release-assets/}" \
                --rawfile signature "${sigs[0]}" \
                '.platforms[$target] = {url: $url, signature: ($signature | rtrimstr("\n"))}' <<<"$manifest")"
            done
            printf '%s\n' "$manifest" >release-assets/latest.json
          fi
          (cd release-assets && sha256sum -- * >SHA256SUMS)
          body="$APP_TITLE source: $APP_REPOSITORY@$APP_SHA"
          [[ -z "$WEB_REPOSITORY" ]] || body+=$'\n'"Bundled web: $WEB_REPOSITORY@$WEB_SHA"
          [[ -z "$BACKEND_REPOSITORY" ]] || body+=$'\n'"Shared backend packages: $BACKEND_REPOSITORY@$BACKEND_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it." >&2
            exit 1
          fi
          tag_file="$RUNNER_TEMP/$RELEASE_PREFIX-tag.json"
          tag_error="$RUNNER_TEMP/$RELEASE_PREFIX-tag.err"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$tag_file" 2>"$tag_error"; then
            jq -e --arg sha "$GITHUB_SHA" \
              '.object.type == "commit" and .object.sha == $sha' "$tag_file" >/dev/null
          elif jq -e '.status == "404" or .status == 404' "$tag_file" >/dev/null; then
            echo "Release tag $RELEASE_TAG does not exist yet; creating it."
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >"$tag_file"
          else
            cat "$tag_error" >&2
            echo 'Unable to verify App release tag; refusing to publish.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$tag_file"
          jq -e --arg sha "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $sha' "$tag_file" >/dev/null
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$APP_TITLE v$VERSION" \
            --notes "$body" \
            --latest=false
          printf 'Published %s with assets:\n' "$RELEASE_TAG"
          printf '  %s\n' release-assets/*
