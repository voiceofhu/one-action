name: Publish combined Web and backend image

'on':
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      action_sha:
        required: true
        type: string
      backend_repository:
        required: true
        type: string
      backend_sha:
        required: true
        type: string
      web_repository:
        required: true
        type: string
      web_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      source_read_token:
        description: Token limited to reading the fixed backend and Web repositories
        required: true
    outputs:
      digest:
        description: Registry digest of the published multi-platform OCI index
        value: ${{ jobs.manifest.outputs.digest }}
      image_ref:
        description: Digest-qualified multi-platform image reference
        value: ${{ jobs.manifest.outputs.image_ref }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ inputs.workflow_name }}-publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan immutable publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      registry_image: ${{ steps.config.outputs.registry_image }}
      publish_tag: ${{ steps.config.outputs.publish_tag }}
      backend_package: ${{ steps.config.outputs.backend_package }}
      backend_dockerfile: ${{ steps.config.outputs.backend_dockerfile }}
      web_package: ${{ steps.config.outputs.web_package }}
      artifact_name: ${{ steps.config.outputs.artifact_name }}
      created_at: ${{ steps.config.outputs.created_at }}
    steps:
      - name: Validate immutable publication inputs
        id: config
        shell: bash
        env:
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          ACTION_SHA: ${{ inputs.action_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          BACKEND_REPOSITORY: ${{ inputs.backend_repository }}
          WEB_SHA: ${{ inputs.web_sha }}
          WEB_REPOSITORY: ${{ inputs.web_repository }}
          VERSION: ${{ inputs.version }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          WORKFLOW_ACTION_SHA: ${{ github.sha }}
          ACTION_REPOSITORY: ${{ github.repository }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          for entry in "action_sha:$ACTION_SHA" "backend_sha:$BACKEND_SHA" "web_sha:$WEB_SHA"; do
            label="${entry%%:*}"
            sha="${entry#*:}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "$label must be an exact commit SHA" >&2
              exit 1
            }
          done
          [ "$ACTION_SHA" = "$WORKFLOW_ACTION_SHA" ] || {
            echo "Action SHA does not match the reusable workflow revision." >&2
            exit 1
          }
          if [ "$ACTION_REPOSITORY" != voiceofhu/one-action ] \
            || [ "$ACTION_SERVER_URL" != https://github.com ]; then
            echo "publication must run from the fixed central Action repository" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || ((${#VERSION} > 32)); then
            echo "version must be at most 32 characters and contain three numeric components without a v prefix" >&2
            exit 1
          fi
          case "$DEPLOYMENT_ENVIRONMENT" in
            dev|stage|prod) ;;
            *) echo "environment must be dev, stage, or prod" >&2; exit 1 ;;
          esac
          case "$WORKFLOW_NAME" in
            one-user)
              registry_image=ghcr.io/voiceofhu/one-user
              backend_package=one-user-backend
              backend_dockerfile=deploy/docker/Dockerfile
              web_package=one-user-web
              expected_backend_repository=voiceofhu/one-user-backend
              expected_web_repository=voiceofhu/one-user-web
              publish_tag="$VERSION"
              ;;
            one-amz)
              registry_image=ghcr.io/voiceofhu/one-amz-backend-next
              backend_package=one-amz-backend
              backend_dockerfile=Dockerfile
              web_package=one-amz-web
              expected_backend_repository=voiceofhu/one-amz-backend-next
              expected_web_repository=voiceofhu/one-amz-web-next
              publish_tag="run-a${ACTION_SHA:0:12}-b${BACKEND_SHA:0:12}-w${WEB_SHA:0:12}-r${RUN_ID}-a${RUN_ATTEMPT}"
              ;;
            *) echo "workflow is not allowed to publish a combined image" >&2; exit 1 ;;
          esac
          if [ "$BACKEND_REPOSITORY" != "$expected_backend_repository" ] \
            || [ "$WEB_REPOSITORY" != "$expected_web_repository" ]; then
            echo "publication sources do not match the fixed product repositories" >&2
            exit 1
          fi
          {
            echo "registry_image=$registry_image"
            echo "publish_tag=$publish_tag"
            echo "backend_package=$backend_package"
            echo "backend_dockerfile=$backend_dockerfile"
            echo "web_package=$web_package"
            echo "artifact_name=web-dist-$WORKFLOW_NAME-${WEB_SHA:0:12}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Build and verify Web once
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Web at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.web_repository }}
          ref: ${{ inputs.web_sha }}
          path: web
          token: ${{ secrets.source_read_token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify and build Web once
        shell: bash
        env:
          EXPECTED_WEB_PACKAGE: ${{ needs.plan.outputs.web_package }}
          WEB_SHA: ${{ inputs.web_sha }}
          VERSION: ${{ inputs.version }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -Eeuo pipefail
          [ "$(git -C web rev-parse HEAD)" = "$WEB_SHA" ] || {
            echo "Web checkout HEAD does not match web_sha." >&2
            exit 1
          }
          test -f web/package.json && test ! -L web/package.json
          test -f web/pnpm-lock.yaml && test ! -L web/pnpm-lock.yaml
          web_package="$(jq -er '.name | select(type == "string")' web/package.json)"
          web_version="$(jq -er '.version | select(type == "string")' web/package.json)"
          [ "$web_package" = "$EXPECTED_WEB_PACKAGE" ] || {
            echo "Web package name does not match the fixed product package." >&2
            exit 1
          }
          [ "$web_version" = "$VERSION" ] || {
            echo "Requested version does not match the Web package version." >&2
            exit 1
          }
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web format:check
          pnpm --dir web lint
          case "$DEPLOYMENT_ENVIRONMENT" in
            dev) pnpm --dir web exec tsc -b && pnpm --dir web exec vite build --mode development ;;
            stage) pnpm --dir web build:stage ;;
            prod) pnpm --dir web build ;;
            *) exit 1 ;;
          esac
          test -f web/dist/index.html
          if find web/dist -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo "Web dist may contain only regular files and directories." >&2
            exit 1
          fi
          git -C web diff --exit-code -- .

      - name: Upload verified Web dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: web/dist
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  verify_backend:
    name: Verify backend source
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout backend at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repository }}
          ref: ${{ inputs.backend_sha }}
          path: backend
          token: ${{ secrets.source_read_token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify locked Rust source
        shell: bash
        working-directory: backend
        env:
          EXPECTED_BACKEND_PACKAGE: ${{ needs.plan.outputs.backend_package }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [ "$(git rev-parse HEAD)" = "$BACKEND_SHA" ] || {
            echo "Backend checkout HEAD does not match backend_sha." >&2
            exit 1
          }
          test -f Cargo.toml && test ! -L Cargo.toml
          test -f Cargo.lock && test ! -L Cargo.lock
          test -f rust-toolchain.toml && test ! -L rust-toolchain.toml
          package_version="$(
            cargo metadata --format-version 1 --no-deps --locked |
              jq -er --arg package "$EXPECTED_BACKEND_PACKAGE" '
                [.packages[] | select(.name == $package) | .version] |
                if length == 1 then .[0] else error("expected exactly one fixed backend package") end
              '
          )"
          [ "$package_version" = "$VERSION" ] || {
            echo "Requested version does not match the backend Cargo package version." >&2
            exit 1
          }
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
          git diff --exit-code -- .

  build:
    name: Build ${{ matrix.suffix }} image
    needs:
      - plan
      - web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment: ghcr-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout backend at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repository }}
          ref: ${{ inputs.backend_sha }}
          path: backend
          token: ${{ secrets.source_read_token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified Web dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: web-dist

      - name: Assemble exact architecture build context
        shell: bash
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          BACKEND_DOCKERFILE: ${{ needs.plan.outputs.backend_dockerfile }}
        run: |
          set -Eeuo pipefail
          [ "$(git -C backend rev-parse HEAD)" = "$BACKEND_SHA" ] || {
            echo "Backend checkout HEAD does not match backend_sha." >&2
            exit 1
          }
          test -f web-dist/index.html
          if find web-dist -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo "Downloaded Web dist may contain only regular files and directories." >&2
            exit 1
          fi
          [ ! -e backend/web-dist ] || {
            echo "backend/web-dist must not be committed in source" >&2
            exit 1
          }
          mkdir backend/web-dist
          cp -R web-dist/. backend/web-dist/
          test -f "backend/$BACKEND_DOCKERFILE" && test ! -L "backend/$BACKEND_DOCKERFILE"
          test -f backend/web-dist/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ needs.plan.outputs.backend_dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.plan.outputs.registry_image }}:${{ needs.plan.outputs.publish_tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.created=${{ needs.plan.outputs.created_at }}
            org.opencontainers.image.source=https://github.com/${{ inputs.backend_repository }}
            org.opencontainers.image.revision=${{ inputs.backend_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            one.action.revision=${{ inputs.action_sha }}
            one.action.repository=${{ github.repository }}
            one.web.revision=${{ inputs.web_sha }}
            one.environment=${{ inputs.environment }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ needs.plan.outputs.registry_image }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ needs.plan.outputs.registry_image }}:buildcache-${{ matrix.suffix }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Verify pushed architecture image
        shell: bash
        env:
          IMAGE_REF: ${{ needs.plan.outputs.registry_image }}:${{ needs.plan.outputs.publish_tag }}-${{ matrix.suffix }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          ACTION_SHA: ${{ inputs.action_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          WEB_SHA: ${{ inputs.web_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          image_json="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}')"
          jq -e \
            --arg architecture "$EXPECTED_ARCHITECTURE" \
            --arg action_sha "$ACTION_SHA" \
            --arg backend_sha "$BACKEND_SHA" \
            --arg web_sha "$WEB_SHA" \
            --arg version "$VERSION" '
              .os == "linux" and
              .architecture == $architecture and
              .config.Labels["one.action.revision"] == $action_sha and
              .config.Labels["org.opencontainers.image.revision"] == $backend_sha and
              .config.Labels["one.web.revision"] == $web_sha and
              .config.Labels["org.opencontainers.image.version"] == $version
            ' <<<"$image_json" >/dev/null || {
              echo "Architecture image platform or provenance labels are invalid." >&2
              exit 1
            }
          image_user="$(jq -er '.config.User | select(type == "string")' <<<"$image_json")"
          image_principal="${image_user%%:*}"
          if [ -z "$image_user" ] || [ "${image_principal,,}" = root ] \
            || [[ "$image_principal" =~ ^0+$ ]]; then
            echo "Final image Config.User must be non-empty and non-root." >&2
            exit 1
          fi

  manifest:
    name: Publish and verify multi-platform OCI index
    needs:
      - plan
      - verify_backend
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment: ghcr-publish
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - name: Checkout exact publication tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.action_sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact multi-platform publisher
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
        run: |
          set -Eeuo pipefail
          [ "$(git -C action rev-parse HEAD)" = "$ACTION_SHA" ] || {
            echo "Action checkout HEAD does not match action_sha." >&2
            exit 1
          }
          expected_blob="$(GIT_NO_REPLACE_OBJECTS=1 git -C action rev-parse "$ACTION_SHA:scripts/release/publish-ghcr-multiarch.sh")"
          actual_blob="$(git hash-object action/scripts/release/publish-ghcr-multiarch.sh)"
          [ "$actual_blob" = "$expected_blob" ] || {
            echo "Central multi-platform publisher changed after exact Action checkout." >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create, verify, and record OCI index
        id: publish
        shell: bash
        env:
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          PUBLISH_IMAGE: ${{ needs.plan.outputs.registry_image }}
          PUBLISH_TAG: ${{ needs.plan.outputs.publish_tag }}
          ACTION_SHA: ${{ inputs.action_sha }}
          ACTION_REPOSITORY: ${{ github.repository }}
          BACKEND_REPOSITORY: ${{ inputs.backend_repository }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          WEB_REPOSITORY: ${{ inputs.web_repository }}
          WEB_SHA: ${{ inputs.web_sha }}
          VERSION: ${{ inputs.version }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_IMAGE_PATH: publication/published-image.json
        run: exec bash action/scripts/release/publish-ghcr-multiarch.sh
