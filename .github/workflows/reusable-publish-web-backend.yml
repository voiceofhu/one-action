name: Publish Web and backend image

'on':
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      action_sha:
        required: true
        type: string
      backend_sha:
        required: true
        type: string
      web_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      created_at:
        required: true
        type: string
    secrets:
      source_read_token:
        required: true
      package_write_token:
        required: true
    outputs:
      digest:
        value: ${{ jobs.manifest.outputs.digest }}
      image_ref:
        value: ${{ jobs.manifest.outputs.image_ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow_name == 'one-user' && 'voiceofhu/one-user-backend' || inputs.workflow_name == 'one-browser-app-server' && 'voiceofhu/one-browser-backend-next' || 'voiceofhu/one-node-server' }}
          ref: ${{ inputs.backend_sha }}
          path: backend
          token: ${{ secrets.source_read_token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Web source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow_name == 'one-user' && 'voiceofhu/one-user-web' || inputs.workflow_name == 'one-browser-app-server' && 'voiceofhu/one-browser-web-next' || 'voiceofhu/one-node-web' }}
          ref: ${{ inputs.web_sha }}
          path: web
          token: ${{ secrets.source_read_token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.workflow_name == 'one-node-server' && '11.7.0' || '10.32.1' }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and stage Web
        shell: bash
        env:
          BUILD_TIME: ${{ inputs.created_at }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          set -Eeuo pipefail
          case "$WORKFLOW_NAME" in
            one-user|one-node-server|one-browser-app-server) ;;
            *) echo "Unsupported workflow: $WORKFLOW_NAME" >&2; exit 1 ;;
          esac
          pnpm --dir web install --frozen-lockfile
          VITE_BUILD_TIME="$BUILD_TIME" pnpm --dir web build
          mkdir backend/web-dist
          cp -R web/dist/. backend/web-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.package_write_token }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.package_write_token }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ inputs.workflow_name == 'one-user' && 'deploy/docker/Dockerfile' || 'Dockerfile' }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ inputs.workflow_name == 'one-user' && 'ghcr.io/voiceofhu/one-user' || inputs.workflow_name == 'one-browser-app-server' && 'ghcr.io/voiceofhu/one-browser-backend' || 'ghcr.io/voiceofhu/node-server' }}:build-${{ inputs.backend_sha }}-${{ inputs.web_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.created=${{ inputs.created_at }}
            org.opencontainers.image.source=https://github.com/${{ inputs.workflow_name == 'one-user' && 'voiceofhu/one-user-backend' || inputs.workflow_name == 'one-browser-app-server' && 'voiceofhu/one-browser-backend-next' || 'voiceofhu/one-node-server' }}
            org.opencontainers.image.revision=${{ inputs.backend_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            one.action.revision=${{ inputs.action_sha }}
            one.action.repository=${{ github.repository }}
            one.web.revision=${{ inputs.web_sha }}
            one.environment=prod
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.workflow_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.workflow_name }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.backend_sha }}

  manifest:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry token owner
        id: registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.package_write_token }}
        run: echo "login=$(gh api user --jq .login)" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.registry.outputs.login }}
          password: ${{ secrets.package_write_token }}

      - name: Publish OCI index
        id: publish
        shell: bash
        env:
          ACTION_SHA: ${{ inputs.action_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          IMAGE: ${{ inputs.workflow_name == 'one-user' && 'ghcr.io/voiceofhu/one-user' || inputs.workflow_name == 'one-browser-app-server' && 'ghcr.io/voiceofhu/one-browser-backend' || 'ghcr.io/voiceofhu/node-server' }}
          VERSION: ${{ inputs.version }}
          WEB_SHA: ${{ inputs.web_sha }}
        run: |
          set -Eeuo pipefail
          image="$IMAGE:$VERSION"
          candidate="$IMAGE:build-$BACKEND_SHA-$WEB_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fingerprint() {
            docker buildx imagetools inspect --raw "$1" |
              jq -er '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.architecture)=\(.digest)"] | sort | if length == 2 then join(",") else error("expected two Linux architectures") end'
          }

          docker buildx imagetools create \
            --tag "$candidate" \
            "$candidate-amd64" \
            "$candidate-arm64"
          candidate_fingerprint="$(fingerprint "$candidate")"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            docker buildx imagetools inspect --raw "$image" |
              jq -e \
                --arg action "$ACTION_SHA" \
                --arg backend "$BACKEND_SHA" \
                --arg version "$VERSION" \
                --arg web "$WEB_SHA" '
                  .annotations["one.action.revision"] == $action and
                  .annotations["org.opencontainers.image.revision"] == $backend and
                  .annotations["org.opencontainers.image.version"] == $version and
                  .annotations["one.web.revision"] == $web
                ' >/dev/null
          else
            docker buildx imagetools create \
              --annotation "index:one.action.revision=$ACTION_SHA" \
              --annotation "index:org.opencontainers.image.revision=$BACKEND_SHA" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:one.web.revision=$WEB_SHA" \
              --tag "$image" \
              "$candidate"
            [[ "$(fingerprint "$image")" == "$candidate_fingerprint" ]]
          fi
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest')"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'image_ref=%s@%s\n' "$image" "$digest" >>"$GITHUB_OUTPUT"
