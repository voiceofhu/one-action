name: One Template Server

# Runs on deploy/template-server/<version> tags pushed by `make deploy-template-server`.
"on":
  push:
    tags: ["deploy/template-server/*"]

permissions:
  contents: read

concurrency:
  group: one-template-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-deploy-server.yml
    with:
      product: template
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
