name: One User

'on':
  push:
    tags:
      - 'user-v*'
  workflow_dispatch:
    inputs:
      expected_action_sha:
        description: Dispatcher-resolved exact central Action commit SHA
        required: true
        type: string
      backend_repository:
        description: One User backend repository
        required: true
        type: string
      backend_ref:
        description: Dispatcher-resolved exact backend commit SHA
        required: true
        type: string
      web_repository:
        description: One User Web repository
        required: true
        type: string
      web_ref:
        description: Dispatcher-resolved exact Web commit SHA
        required: true
        type: string
      version:
        description: Optional for non-publishing runs; required x.y.z OCI label for publication
        required: false
        type: string
      publish:
        description: Publish the exact sources to the fixed One User GHCR package
        required: false
        type: boolean
        default: false
      confirmation:
        description: Dispatcher-owned workflow and Action-SHA-bound publication confirmation
        required: false
        type: string

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expected_action_sha: ${{ steps.normalize.outputs.expected_action_sha }}
      backend_repository: ${{ steps.normalize.outputs.backend_repository }}
      backend_ref: ${{ steps.normalize.outputs.backend_ref }}
      web_repository: ${{ steps.normalize.outputs.web_repository }}
      web_ref: ${{ steps.normalize.outputs.web_ref }}
      version: ${{ steps.normalize.outputs.version }}
      publish: ${{ steps.normalize.outputs.publish }}
    steps:
      - name: Checkout exact workflow tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize release inputs
        id: normalize
        shell: bash
        env:
          ACTION_SHA: ${{ github.sha }}
          ACTION_SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_BACKEND_REF: ${{ inputs.backend_ref }}
          INPUT_BACKEND_REPOSITORY: ${{ inputs.backend_repository }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_WEB_REF: ${{ inputs.web_ref }}
          INPUT_WEB_REPOSITORY: ${{ inputs.web_repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          emit_output() {
            local name="$1"
            local value="$2"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Workflow input contains a line break: $name" >&2
              exit 1
            }
            printf '%s=%s\n' "$name" "$value" >>"$GITHUB_OUTPUT"
          }

          [ "$GITHUB_REPOSITORY" = 'voiceofhu/one-action' ] \
            && [ "$ACTION_SERVER_URL" = 'https://github.com' ] || {
            echo 'One User releases are accepted only from voiceofhu/one-action.' >&2
            exit 1
          }
          [[ "$ACTION_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Workflow did not resolve to an exact Action commit SHA.' >&2
            exit 1
          }
          [ "$(git -C action rev-parse HEAD)" = "$ACTION_SHA" ] || {
            echo 'Checked-out workflow tooling does not match the Action commit.' >&2
            exit 1
          }

          case "$EVENT_NAME" in
            push)
              [[ "$TAG_NAME" =~ ^user-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo 'Control tag must use user-v<major>.<minor>.<patch>.' >&2
                exit 1
              }
              [ -n "$GH_TOKEN" ] || {
                echo 'Repository Secret GH_TOKEN is required.' >&2
                exit 1
              }
              version="${TAG_NAME#user-v}"
              source_tag="v$version"
              expected_action_sha="$ACTION_SHA"
              backend_repository='voiceofhu/one-user-backend'
              backend_ref="$(bash action/scripts/github/resolve-ref.sh \
                "$backend_repository" "$source_tag")"
              web_repository='voiceofhu/one-user-web'
              web_ref="$(bash action/scripts/github/resolve-ref.sh \
                "$web_repository" "$source_tag")"
              publish='true'
              confirmation="enable:one-user:$ACTION_SHA"
              ;;
            workflow_dispatch)
              expected_action_sha="$INPUT_EXPECTED_ACTION_SHA"
              backend_repository="$INPUT_BACKEND_REPOSITORY"
              backend_ref="$INPUT_BACKEND_REF"
              web_repository="$INPUT_WEB_REPOSITORY"
              web_ref="$INPUT_WEB_REF"
              version="$INPUT_VERSION"
              publish="$INPUT_PUBLISH"
              confirmation="$INPUT_CONFIRMATION"
              ;;
            *)
              echo "Unsupported workflow event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          [ "$expected_action_sha" = "$ACTION_SHA" ] || {
            echo 'Expected Action SHA is missing, invalid, or stale.' >&2
            exit 1
          }
          [ "$backend_repository" = 'voiceofhu/one-user-backend' ] \
            && [ "$web_repository" = 'voiceofhu/one-user-web' ] || {
            echo 'One User publication accepts only the fixed source repositories.' >&2
            exit 1
          }
          [[ "$backend_ref" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$web_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'One User source refs must be exact commit SHAs.' >&2
            exit 1
          }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ -n "$GH_TOKEN" ] || {
              echo 'Repository Secret GH_TOKEN is required.' >&2
              exit 1
            }
            [ "$(bash action/scripts/github/resolve-ref.sh "$backend_repository" "$backend_ref")" = "$backend_ref" ] \
              && [ "$(bash action/scripts/github/resolve-ref.sh "$web_repository" "$web_ref")" = "$web_ref" ] || {
              echo 'One User source commits could not be verified.' >&2
              exit 1
            }
          fi
          if [ -n "$version" ]; then
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              && ((${#version} <= 32)) || {
              echo 'Version must be an unprefixed three-component numeric version.' >&2
              exit 1
            }
          fi
          case "$publish" in
            true|false) ;;
            *) echo 'Publish must be true or false.' >&2; exit 1 ;;
          esac
          if [ "$publish" = true ]; then
            [ -n "$version" ] || {
              echo 'Publication requires a canonical version.' >&2
              exit 1
            }
            [ "$confirmation" = "enable:one-user:$ACTION_SHA" ] || {
              echo 'Publication lacks the Action-bound confirmation.' >&2
              exit 1
            }
          elif [ -n "$confirmation" ]; then
            echo 'A non-publishing run must not include confirmation.' >&2
            exit 1
          fi
          emit_output expected_action_sha "$expected_action_sha"
          emit_output backend_repository "$backend_repository"
          emit_output backend_ref "$backend_ref"
          emit_output web_repository "$web_repository"
          emit_output web_ref "$web_ref"
          emit_output version "$version"
          emit_output publish "$publish"

  publish:
    if: needs.normalize.outputs.publish == 'true'
    needs: normalize
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-web-backend.yml
    with:
      workflow_name: one-user
      action_sha: ${{ needs.normalize.outputs.expected_action_sha }}
      backend_repository: ${{ needs.normalize.outputs.backend_repository }}
      backend_sha: ${{ needs.normalize.outputs.backend_ref }}
      web_repository: ${{ needs.normalize.outputs.web_repository }}
      web_sha: ${{ needs.normalize.outputs.web_ref }}
      version: ${{ needs.normalize.outputs.version }}
      environment: prod
    secrets:
      source_read_token: ${{ secrets.GH_TOKEN }}
      package_write_token: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Deploy One User image
    if: needs.normalize.outputs.publish == 'true' && needs.publish.result == 'success'
    needs:
      - normalize
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: one-user-prod
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: one-user-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.normalize.outputs.expected_action_sha }}
          path: action
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: exec bash action/scripts/deploy/configure-ssh.sh

      - name: Log server in to GitHub Container Registry
        id: registry_login
        shell: bash
        env:
          SSH_HOST: one-user-deploy
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_SUDO: ${{ vars.DEPLOY_USE_SUDO || '0' }}
        run: exec bash action/scripts/deploy/registry-auth.sh

      - name: Deploy image with Docker Compose
        shell: bash
        env:
          SSH_HOST: one-user-deploy
          REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/opt/one-user' }}
          DOCKER_IMAGE: ${{ needs.publish.outputs.image_ref }}
          COMPOSE_PROJECT_NAME: ${{ vars.DEPLOY_COMPOSE_PROJECT_NAME || 'one-user' }}
          COMPOSE_SERVICE_NAME: ${{ vars.DEPLOY_COMPOSE_SERVICE_NAME || 'user' }}
          READY_URL: ${{ vars.DEPLOY_READY_URL || 'http://127.0.0.1:27510/readyz' }}
          USE_SUDO: ${{ vars.DEPLOY_USE_SUDO || '0' }}
          LOG_TAIL: ${{ vars.DEPLOY_LOG_TAIL || '120' }}
        run: exec bash action/scripts/deploy/deploy-user.sh

      - name: Log server out of GitHub Container Registry
        if: ${{ always() && steps.registry_login.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: one-user-deploy
          REGISTRY_ACTION: logout
          USE_SUDO: ${{ vars.DEPLOY_USE_SUDO || '0' }}
        run: exec bash action/scripts/deploy/registry-auth.sh
