name: One VPS Web
run-name: ${{ github.workflow }}

# Runs on deploy/vps-web/<version> tags pushed by `make deploy-vps-web`.
"on":
  push:
    tags: ["deploy/vps-web/*"]

permissions:
  contents: read

jobs:
  release:
    # Next.js Web: its own image and Compose service (products.json web_runtime).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-deploy-web-image.yml
    with:
      product: vps
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
